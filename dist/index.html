<style>/* Accordion recipe — contract slots only (contract/authoring.md step 3).
   Structure and states: contract/anatomy/accordion.json. Character: the theme. */

[data-slot="accordion"] {
  display: flex;
  flex-direction: column;
  width: 100%;
}

/* item — bottom rule between items; the last item drops it */
[data-slot="accordion"] [data-slot="item"] {
  border-block-end: var(--border-width) solid var(--border-subtle);
}
[data-slot="accordion"] [data-slot="item"]:last-child {
  border-block-end: none;
}

/* the heading wrapper carries no chrome — the button is the control */
[data-slot="accordion"] [data-slot="heading"] {
  margin: 0;
  font: inherit;
}

/* trigger */
[data-slot="accordion"] [data-slot="trigger"] {
  display: flex;
  width: 100%;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-inline-md);
  padding-block: var(--space-stack-md);
  padding-inline: 0;
  border: none;
  border-radius: var(--radius-control);
  background: transparent;
  font: var(--type-label);
  color: var(--on-surface);
  text-align: start;
  cursor: var(--cursor-interactive);
  outline: none;
  transition:
    background-color var(--duration-fast) var(--easing-standard),
    color var(--duration-fast) var(--easing-standard);
}
[data-slot="accordion"] [data-slot="trigger"][data-indicator="leading"] {
  justify-content: flex-start;
}
[data-slot="accordion"] [data-slot="trigger"]:hover {
  background: var(--interaction-hover);
}
[data-slot="accordion"] [data-slot="trigger"]:focus-visible {
  outline: var(--focus-width) var(--focus-style) color-mix(in oklab, var(--focus) 60%, transparent);
  outline-offset: var(--focus-offset);
}
[data-slot="accordion"] [data-slot="trigger"][data-disabled],
[data-slot="accordion"] [data-slot="trigger"]:disabled {
  opacity: 0.5;
  pointer-events: none;
  cursor: var(--cursor-disabled);
}

/* label — the content slot inside the trigger */
[data-slot="accordion"] [data-slot="label"] {
  flex: 1;
  font: var(--type-label);
}
[data-slot="accordion"] [data-slot="trigger"][data-indicator="leading"] [data-slot="label"] {
  flex: 0 1 auto;
}

/* indicator — expand icon role; rotates 180deg on open at duration-fast */
[data-slot="accordion"] [data-slot="indicator"] {
  display: inline-flex;
  flex-shrink: 0;
  color: var(--content-secondary);
  transition: transform var(--duration-fast) var(--easing-standard);
}
[data-slot="accordion"] [data-slot="indicator"] svg {
  width: var(--icon-size-control);
  height: var(--icon-size-control);
}
[data-slot="accordion"] [data-slot="trigger"][data-state="open"] [data-slot="indicator"] {
  transform: rotate(180deg);
}

/* panel — height animates between 0 and content height, overflow hidden */
[data-slot="accordion"] [data-slot="panel"] {
  display: grid;
  grid-template-rows: 0fr;
  overflow: hidden;
  font: var(--type-body);
  transition: grid-template-rows var(--duration-base) var(--easing-standard);
}
[data-slot="accordion"] [data-slot="panel"][data-state="open"] {
  grid-template-rows: 1fr;
}
[data-slot="accordion"] [data-slot="panel-inner"] {
  min-height: 0;
  overflow: hidden;
}
[data-slot="accordion"] [data-slot="panel"][data-state="open"] [data-slot="panel-inner"] {
  padding-block-end: var(--space-stack-sm);
}

@media (prefers-reduced-motion: reduce) {
  [data-slot="accordion"] [data-slot="trigger"],
  [data-slot="accordion"] [data-slot="indicator"],
  [data-slot="accordion"] [data-slot="panel"] {
    transition: none;
  }
}

/* Alert recipe — contract slots only (contract/authoring.md step 3).
   Structure, tone axis and states: contract/anatomy/alert.json.
   Character arrives entirely through the active theme. */

[data-slot="alert"] {
  display: grid;
  grid-template-columns: auto 1fr auto;
  align-items: start;
  width: 100%;
  column-gap: var(--space-inline-md);
  row-gap: var(--space-stack-sm);
  padding: var(--inset-container);
  border: var(--border-width) solid var(--border);
  border-radius: var(--radius-container);
  background: var(--surface-raised);
  color: var(--on-surface-raised);
  transition:
    background-color var(--duration-fast) var(--easing-standard),
    border-color var(--duration-fast) var(--easing-standard);
}

/* icon — column 1; the tone axis swaps its colour */
[data-slot="alert"] > [data-slot="icon"] {
  grid-column: 1;
  grid-row: 1;
  display: inline-flex;
  align-items: center;
  color: var(--status-info);
}
[data-slot="alert"] > [data-slot="icon"] svg {
  width: var(--icon-size-control);
  height: var(--icon-size-control);
  stroke-width: var(--icon-stroke);
}

/* content parts flow down column 2 in source order */
[data-slot="alert"] > [data-slot="title"],
[data-slot="alert"] > [data-slot="description"],
[data-slot="alert"] > [data-slot="action-slot"] {

[data-slot="alert"] > [data-slot="title"] {

  color: var(--on-surface-raised);
}
[data-slot="alert"] > [data-slot="description"] {
  font: var(--type-body);
  color: var(--content-secondary);
}
[data-slot="alert"] > [data-slot="action-slot"] {
  display: flex;
  align-items: center;
  gap: var(--space-inline-md);
  font: var(--type-action);

/* close — column 3, top-aligned with the title */

  grid-column: 3;
  grid-row: 1;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: var(--space-unit);
  border: none;
  border-radius: var(--radius-control);
  background: transparent;
  color: inherit;
  cursor: var(--cursor-interactive);
  transition: background-color var(--duration-fast) var(--easing-standard);
}
[data-slot="alert"] > [data-slot="close"] svg {
  width: var(--icon-size-inline);
  height: var(--icon-size-inline);
  stroke-width: var(--icon-stroke);
}
[data-slot="alert"] > [data-slot="close"]:hover {
  background: var(--interaction-hover);
}
[data-slot="alert"] > [data-slot="close"]:focus-visible {
  outline: var(--focus-width) var(--focus-style)
    color-mix(in oklab, var(--focus) 60%, transparent);
  outline-offset: var(--focus-offset);
}

/* tone axis (contract/variants.md) — status accent on root + icon */
[data-slot="alert"][data-tone="info"] {
  background: var(--status-info-surface);
  border-color: var(--status-info-border);
}
[data-slot="alert"][data-tone="info"] > [data-slot="icon"] { color: var(--status-info); }

[data-slot="alert"][data-tone="success"] {
  background: var(--status-success-surface);
  border-color: var(--status-success-border);
}
[data-slot="alert"][data-tone="success"] > [data-slot="icon"] { color: var(--status-success); }

[data-slot="alert"][data-tone="warning"] {
  background: var(--status-warning-surface);
  border-color: var(--status-warning-border);
}
[data-slot="alert"][data-tone="warning"] > [data-slot="icon"] { color: var(--status-warning); }

[data-slot="alert"][data-tone="critical"] {
  background: var(--status-critical-surface);
  border-color: var(--status-critical-border);
}
[data-slot="alert"][data-tone="critical"] > [data-slot="icon"] { color: var(--status-critical); }

@media (prefers-reduced-motion: reduce) {
  [data-slot="alert"],
  [data-slot="alert"] > [data-slot="close"] { transition: none; }
}

   Same overlay grammar as dialog; the close affordance is deliberately absent
   and the cancel/action pair is mandatory. Character: the theme. */

/* scrim */
[data-slot="alert-dialog"] [data-slot="scrim"] {
  position: fixed;
  inset: 0;
  z-index: var(--layer-modal);
  background: var(--overlay-scrim);
}
[data-slot="alert-dialog"] [data-slot="scrim"][data-state="open"] {
  animation: alert-dialog-scrim-fade var(--duration-base) var(--easing-standard);
}
@keyframes alert-dialog-scrim-fade {
  from { opacity: 0; }
  to { opacity: 1; }
}

/* panel — size axis binds to the size-overlay-* width ramp; default is sm
   because an alert dialog carries one decision, not a form */
[data-slot="alert-dialog"] [data-slot="panel"] {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  z-index: var(--layer-modal);
  display: flex;
  flex-direction: column;
  gap: var(--space-stack-md);
  width: calc(100% - var(--inset-container) * 2);
  max-width: var(--size-overlay-sm);
  max-height: calc(100% - var(--inset-container) * 2);
  overflow-y: auto;
  padding: var(--inset-container);
  background: var(--surface-overlay);
  color: var(--on-surface-overlay);
  border: var(--border-width) solid var(--border);
  border-radius: var(--radius-overlay);
  box-shadow: var(--elevation-modal);
  outline: none;
}
[data-slot="alert-dialog"] [data-slot="panel"][data-size="md"] { max-width: var(--size-overlay-md); }
[data-slot="alert-dialog"] [data-slot="panel"][data-size="lg"] { max-width: var(--size-overlay-lg); }
[data-slot="alert-dialog"] [data-slot="panel"][data-state="open"] {
  animation: alert-dialog-panel-enter var(--duration-base) var(--easing-enter);
}
@keyframes alert-dialog-panel-enter {
  from { opacity: 0; transform: translate(-50%, -50%) scale(0.95); }
  to { opacity: 1; transform: translate(-50%, -50%) scale(1); }
}

/* media — optional emphasis glyph; tone follows the consequence */
[data-slot="alert-dialog"] [data-slot="media"] {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  align-self: flex-start;
  width: var(--control-height-lg);
  height: var(--control-height-lg);
  border-radius: var(--radius-control);
  background: var(--surface-sunken);
  color: var(--status-warning);
}
[data-slot="alert-dialog"] [data-slot="media"][data-tone="critical"] {
  background: var(--status-critical-surface);
  color: var(--status-critical);
}
[data-slot="alert-dialog"] [data-slot="media"] svg {
  width: var(--icon-size-emphasis);
  height: var(--icon-size-emphasis);
}

/* header */
[data-slot="alert-dialog"] [data-slot="header"] {
  display: flex;
  flex-direction: column;
  gap: var(--space-stack-sm);
}

/* title */
[data-slot="alert-dialog"] [data-slot="title"] {
  margin: 0;
  font: var(--type-heading-3);
  color: var(--on-surface-overlay);
}

/* description — required; states the consequence */
[data-slot="alert-dialog"] [data-slot="description"] {
  margin: 0;
  font: var(--type-body);
  color: var(--content-secondary);
}

/* footer — end-aligned action slot, stacks vertically on narrow viewports */
[data-slot="alert-dialog"] [data-slot="footer"] {
  display: flex;
  justify-content: flex-end;
  gap: var(--space-inline-md);
}
@media (max-width: 480px) {
  [data-slot="alert-dialog"] [data-slot="footer"] {
    flex-direction: column-reverse;
  }
}

/* cancel + action — the button recipe (anatomy/button.json) at this scale */
[data-slot="alert-dialog"] [data-slot="cancel"],
[data-slot="alert-dialog"] [data-slot="action"] {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  height: var(--control-height-md);
  padding: 0 var(--inset-control-x);
  border: var(--border-width) solid transparent;
  border-radius: var(--radius-control);
  font: var(--type-action);
  text-transform: var(--action-case);
  letter-spacing: var(--action-tracking);
  cursor: var(--cursor-interactive);
  outline: none;
  transition:
    background-color var(--duration-fast) var(--easing-standard),
    border-color var(--duration-fast) var(--easing-standard),
    color var(--duration-fast) var(--easing-standard);
}

/* cancel — secondary x outline; receives initial focus */
[data-slot="alert-dialog"] [data-slot="cancel"] {
  background: transparent;
  border-color: var(--border);
  color: var(--on-surface-overlay);
}
[data-slot="alert-dialog"] [data-slot="cancel"]:hover {
  background: var(--interaction-hover);
}

/* action — primary x solid, danger when the consequence is destructive */
[data-slot="alert-dialog"] [data-slot="action"] {
  background: var(--action);
  color: var(--on-action);
  box-shadow: var(--elevation-resting);
}
[data-slot="alert-dialog"] [data-slot="action"]:hover {
  background: var(--action-hover);
}
[data-slot="alert-dialog"] [data-slot="action"]:active {
  background: var(--action-active);
}
[data-slot="alert-dialog"] [data-slot="action"][data-emphasis="danger"] {
  background: var(--status-critical);
  color: var(--on-status-critical);
}
[data-slot="alert-dialog"] [data-slot="action"][data-emphasis="danger"]:hover {
  background: color-mix(in oklab, var(--status-critical) 90%, var(--on-status-critical));
}

[data-slot="alert-dialog"] [data-slot="cancel"]:focus-visible,
[data-slot="alert-dialog"] [data-slot="action"]:focus-visible {
  outline: var(--focus-width) solid color-mix(in oklab, var(--focus) 60%, transparent);
  outline-offset: var(--focus-offset);
}

@media (prefers-reduced-motion: reduce) {
  [data-slot="alert-dialog"] [data-slot="scrim"][data-state="open"],
  [data-slot="alert-dialog"] [data-slot="panel"][data-state="open"] { animation: none; }
  [data-slot="alert-dialog"] [data-slot="cancel"],
  [data-slot="alert-dialog"] [data-slot="action"] { transition: none; }
}

/* LIFTED from shadcn/aspect-ratio.tsx via scripts/lift.py — the dictionary run in reverse.
   Review against contract/anatomy/aspect-ratio.json + the button exemplar before accepting.
   Unmapped words: see aspect-ratio.lift-report.json */

/* Avatar recipe — contract slots only (contract/authoring.md step 3).
   LIFTED from shadcn/avatar.tsx via scripts/lift.py, then reviewed against
   contract/anatomy/avatar.json + the button exemplar. Shape (radius-pill)
   is a theme decision (anatomyNotes).
   Unmapped words: see avatar.lift-report.json */

/* root — square; size axis binds both dimensions to control-height-* */
[data-slot="avatar"] {
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  width: var(--control-height-md);
  height: var(--control-height-md);
  overflow: hidden;
  border-radius: var(--radius-pill);
  user-select: none;
}
[data-slot="avatar"][data-size="sm"] { width: var(--control-height-sm); height: var(--control-height-sm); }
[data-slot="avatar"][data-size="lg"] { width: var(--control-height-lg); height: var(--control-height-lg); }

/* image — aspect-ratio 1; shown only after successful load (TSX gates it) */
[data-slot="avatar"] [data-slot="image"] {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  aspect-ratio: 1 / 1;
  object-fit: cover;
  border-radius: var(--radius-pill);
}

/* fallback — initials text, or the user icon role */
[data-slot="avatar"] [data-slot="fallback"] {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  height: 100%;
  background: var(--surface-sunken);
  color: var(--content-secondary);
  font: var(--type-label);
}
[data-slot="avatar"] [data-slot="fallback"] svg {
  width: var(--icon-size-control);
  height: var(--icon-size-control);
}
[data-slot="avatar"][data-size="sm"] [data-slot="fallback"] { font: var(--type-caption); }
[data-slot="avatar"][data-size="sm"] [data-slot="fallback"] svg { width: var(--icon-size-inline); height: var(--icon-size-inline); }
[data-slot="avatar"][data-size="lg"] [data-slot="fallback"] svg { width: var(--icon-size-emphasis); height: var(--icon-size-emphasis); }

/* group — stacked avatars overlap; surface-colored ring separates
   members (a recipe, not a token — anatomy note) */
[data-slot="avatar"] [data-slot="group"] {
  display: inline-flex;
}
[data-slot="avatar"] [data-slot="group"] [data-slot="avatar"] {
  box-shadow: 0 0 0 var(--border-width-strong) var(--surface);
}
[data-slot="avatar"] [data-slot="group"] [data-slot="avatar"]:not(:first-child) {
  margin-inline-start: calc(var(--space-inline-sm) * -2);
}

/* Badge recipe — contract slots only (contract/authoring.md step 3).
   Structure and axes: contract/anatomy/badge.json. Character: the theme.
   Never for actions — presentational status label, no interactive states.
   Tone selects the status family (status-<tone>-*); prominence picks fill
   (solid: on-status-<tone> on status-<tone>) vs surface (outline:
   status-<tone> content on status-<tone>-surface with status-<tone>-border).
   Lifted from shadcn/badge.tsx via scripts/lift.py, then reviewed against
   the anatomy + button exemplar. Unmapped words: badge.lift-report.json */

[data-slot="badge"] {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: fit-content;
  flex-shrink: 0;
  gap: var(--space-inline-sm);
  padding-inline: var(--space-inline-md);
  padding-block: calc(var(--space-unit) * 0.5);
  border: var(--border-width) solid transparent;
  border-radius: var(--radius-pill);
  font: var(--type-caption);
  white-space: nowrap;
  overflow: hidden;
}

[data-slot="badge"] svg {
  width: var(--icon-size-inline);
  height: var(--icon-size-inline);
  pointer-events: none;
}

/* tone × prominence: solid — on-status content on status fill */
[data-slot="badge"][data-prominence="solid"][data-tone="info"] { background: var(--status-info); color: var(--on-status-info); }
[data-slot="badge"][data-prominence="solid"][data-tone="success"] { background: var(--status-success); color: var(--on-status-success); }
[data-slot="badge"][data-prominence="solid"][data-tone="warning"] { background: var(--status-warning); color: var(--on-status-warning); }
[data-slot="badge"][data-prominence="solid"][data-tone="critical"] { background: var(--status-critical); color: var(--on-status-critical); }

/* outline — status-<tone> text on status-<tone>-surface bg + status border */
[data-slot="badge"][data-prominence="outline"][data-tone="info"] { background: var(--status-info-surface); color: var(--status-info); border-color: var(--status-info-border); }
[data-slot="badge"][data-prominence="outline"][data-tone="success"] { background: var(--status-success-surface); color: var(--status-success); border-color: var(--status-success-border); }
[data-slot="badge"][data-prominence="outline"][data-tone="warning"] { background: var(--status-warning-surface); color: var(--status-warning); border-color: var(--status-warning-border); }
[data-slot="badge"][data-prominence="outline"][data-tone="critical"] { background: var(--status-critical-surface); color: var(--status-critical); border-color: var(--status-critical-border); }

/* Breadcrumb recipe — contract slots only (contract/authoring.md step 3).
   Structure and states: contract/anatomy/breadcrumb.json. Character: the theme. */

[data-slot="breadcrumb"] {
  display: block;
}

/* list — wraps rather than truncates when it cannot collapse */
[data-slot="breadcrumb"] [data-slot="list"] {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--space-inline-md);
  margin: 0;
  padding: 0;
  list-style: none;
  font: var(--type-label);
  color: var(--content-secondary);
}

/* item */
[data-slot="breadcrumb"] [data-slot="item"] {
  display: inline-flex;
  align-items: center;
  gap: var(--space-inline-sm);
}

/* link — rest in content-secondary; hover/focus-visible resolve to on-surface */
[data-slot="breadcrumb"] [data-slot="link"] {
  display: inline-flex;
  align-items: center;
  border-radius: var(--radius-control);
  color: var(--content-secondary);
  text-decoration: none;
  text-underline-offset: var(--link-decoration-offset);
  cursor: var(--cursor-interactive);
  outline: none;
  transition: color var(--duration-fast) var(--easing-standard);
}
[data-slot="breadcrumb"] [data-slot="link"]:hover {
  color: var(--on-surface);
  text-decoration: var(--link-decoration);
}
[data-slot="breadcrumb"] [data-slot="link"]:focus-visible {
  color: var(--on-surface);
  outline: var(--focus-width) var(--focus-style) color-mix(in oklab, var(--focus) 60%, transparent);
  outline-offset: var(--focus-offset);
}

/* current — the page you are on; not a link, not focusable */
[data-slot="breadcrumb"] [data-slot="current"] {
  font: var(--type-label);
  color: var(--on-surface);
}

/* separator — decorative, forward icon role */
[data-slot="breadcrumb"] [data-slot="separator"] {
  display: inline-flex;
  align-items: center;
  color: var(--content-secondary);
}
[data-slot="breadcrumb"] [data-slot="separator"] svg {
  width: var(--icon-size-inline);
  height: var(--icon-size-inline);
}

/* overflow — the collapse point; overflow icon role */
[data-slot="breadcrumb"] [data-slot="overflow"] {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: var(--target-min);
  min-height: var(--target-min);
  padding: 0;
  border: none;
  border-radius: var(--radius-control);
  background: transparent;
  color: var(--content-secondary);
  cursor: var(--cursor-interactive);
  outline: none;
  transition:
    background-color var(--duration-fast) var(--easing-standard),
    color var(--duration-fast) var(--easing-standard);
}
[data-slot="breadcrumb"] [data-slot="overflow"]:hover {
  background: var(--interaction-hover);
  color: var(--on-surface);
}
[data-slot="breadcrumb"] [data-slot="overflow"]:focus-visible {
  outline: var(--focus-width) var(--focus-style) color-mix(in oklab, var(--focus) 60%, transparent);
  outline-offset: var(--focus-offset);
}
[data-slot="breadcrumb"] [data-slot="overflow"] svg {
  width: var(--icon-size-control);
  height: var(--icon-size-control);
}

@media (prefers-reduced-motion: reduce) {
  [data-slot="breadcrumb"] [data-slot="link"],
  [data-slot="breadcrumb"] [data-slot="overflow"] {
    transition: none;
  }
}

/* Button recipe — contract slots only (contract/authoring.md step 3).
   Structure and states: contract/anatomy/button.json. Character: the theme. */

[data-slot="button"] {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--space-inline-md);
  height: var(--control-height-md);
  padding: 0 var(--inset-control-x);
  border: var(--border-width) solid transparent;
  border-radius: var(--radius-control);
  font: var(--type-action);
  text-transform: var(--action-case);
  letter-spacing: var(--action-tracking);
  cursor: var(--cursor-interactive);
  box-shadow: var(--elevation-resting);
  transition:
    background-color var(--duration-fast) var(--easing-standard),
    border-color var(--duration-fast) var(--easing-standard),
    color var(--duration-fast) var(--easing-standard);
}

/* size axis */
[data-slot="button"][data-size="sm"] { height: var(--control-height-sm); padding: 0 calc(var(--inset-control-x) * 0.75); }
[data-slot="button"][data-size="lg"] { height: var(--control-height-lg); padding: 0 calc(var(--inset-control-x) * 1.25); }

/* emphasis × prominence: solid */
[data-prominence="solid"][data-emphasis="primary"] { background: var(--action); color: var(--on-action); }
[data-prominence="solid"][data-emphasis="primary"]:hover { background: var(--action-hover); }
[data-prominence="solid"][data-emphasis="primary"]:active { background: var(--action-active); }
[data-prominence="solid"][data-emphasis="secondary"] { background: var(--action-secondary); color: var(--on-action-secondary); }
[data-prominence="solid"][data-emphasis="secondary"]:hover { background: color-mix(in oklab, var(--action-secondary) 92%, var(--on-action-secondary)); }
[data-prominence="solid"][data-emphasis="danger"] { background: var(--status-critical); color: var(--on-status-critical); }
[data-prominence="solid"][data-emphasis="danger"]:hover { background: color-mix(in oklab, var(--status-critical) 90%, var(--on-status-critical)); }

/* outline */
[data-prominence="outline"] { background: transparent; box-shadow: none; }
[data-prominence="outline"][data-emphasis="secondary"] { border-color: var(--border); color: var(--on-surface); }
[data-prominence="outline"][data-emphasis="primary"] { border-color: var(--action); color: var(--action); }
[data-prominence="outline"][data-emphasis="danger"] { border-color: var(--status-critical); color: var(--status-critical); }
[data-prominence="outline"]:hover { background: var(--interaction-hover); }

/* ghost */
[data-prominence="ghost"] { background: transparent; box-shadow: none; }
[data-prominence="ghost"][data-emphasis="secondary"] { color: var(--on-surface); }
[data-prominence="ghost"][data-emphasis="primary"] { color: var(--action); }
[data-prominence="ghost"][data-emphasis="danger"] { color: var(--status-critical); }
[data-prominence="ghost"]:hover { background: var(--interaction-hover); }

/* link */
[data-prominence="link"] {
  background: transparent; box-shadow: none; height: auto; padding: 0;
  color: var(--link);
  text-decoration: var(--link-decoration);
  text-underline-offset: var(--link-decoration-offset);
}

/* states (contract/states.md) */
[data-slot="button"]:focus-visible {
  outline: var(--focus-width) solid color-mix(in oklab, var(--focus) 60%, transparent);
  outline-offset: var(--focus-offset);
}
[data-slot="button"][data-disabled],
[data-slot="button"]:disabled {
  opacity: 0.5;
  pointer-events: none;
  cursor: var(--cursor-disabled);
}
[data-slot="button"][data-state="loading"] { cursor: var(--cursor-busy); }

/* icon parts */
[data-slot="icon-leading"] svg,
[data-slot="icon-trailing"] svg,
[data-slot="loading-indicator"] svg {
  width: var(--icon-size-control);
  height: var(--icon-size-control);
}
[data-slot="loading-indicator"] svg {
  animation: button-spin var(--duration-slow) linear infinite;
}
@keyframes button-spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) {
  [data-slot="button"] { transition: none; }
  [data-slot="loading-indicator"] svg { animation: none; }
}

/* Button-group recipe — contract slots only (contract/authoring.md step 3).
   Structure and orientation axis: contract/anatomy/button-group.json.
   The group's whole job is joining its children: inner radii collapse to 0,
   adjacent borders merge to a single hairline, and a focused child is raised
   above its neighbours so the focus ring is never clipped.
   Interaction states live on the children, never on the group. */

[data-slot="button-group"] {
  display: inline-flex;
  align-items: center;
  border-radius: var(--radius-control);
}
[data-slot="button-group"][data-orientation="vertical"] {
  flex-direction: column;
  align-items: stretch;
}

/* item-slot adds no recipe of its own — it hands its child straight to the
   group's flex layout so the hosted button keeps its emphasis/prominence/size */
[data-slot="button-group"] > [data-slot="item-slot"] {
  display: contents;
}

/* join: square every inner corner, round only the outer ones */
[data-slot="button-group"] > [data-slot="item-slot"] > * {
  border-radius: 0;
}
[data-slot="button-group"] > [data-slot="item-slot"]:first-child > * {
  border-start-start-radius: var(--radius-control);
  border-end-start-radius: var(--radius-control);
}
[data-slot="button-group"] > [data-slot="item-slot"]:last-child > * {
  border-start-end-radius: var(--radius-control);
  border-end-end-radius: var(--radius-control);
}
[data-slot="button-group"][data-orientation="vertical"] > [data-slot="item-slot"]:first-child > * {
  border-radius: var(--radius-control) var(--radius-control) 0 0;
}
[data-slot="button-group"][data-orientation="vertical"] > [data-slot="item-slot"]:last-child > * {
  border-radius: 0 0 var(--radius-control) var(--radius-control);
}
[data-slot="button-group"] > [data-slot="item-slot"]:only-child > * {
  border-radius: var(--radius-control);
}

/* merge adjacent borders into one hairline */
[data-slot="button-group"] > [data-slot="item-slot"] + [data-slot="item-slot"] > * {
  margin-inline-start: calc(var(--border-width) * -1);
}
[data-slot="button-group"][data-orientation="vertical"] > [data-slot="item-slot"] + [data-slot="item-slot"] > * {
  margin-inline-start: 0;
  margin-block-start: calc(var(--border-width) * -1);
}

/* raise the focused child so its ring is never clipped by a neighbour */
[data-slot="button-group"] > [data-slot="item-slot"] > *:focus-visible,
[data-slot="button-group"] > [data-slot="item-slot"] > *:focus-within {
  position: relative;
  z-index: var(--layer-sticky);
}

/* text — static affix segment */
[data-slot="button-group"] [data-slot="text"] {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  height: var(--control-height-md);
  padding-inline: var(--inset-control-x);
  border: var(--border-width) solid var(--border);
  background: var(--surface-sunken);
  color: var(--on-surface);
  font: var(--type-label);
  white-space: nowrap;
  user-select: none;
}

/* separator — rule between sub-groups, on the group's cross axis */
[data-slot="button-group"] [data-slot="separator"] {
  align-self: stretch;
  width: var(--border-width);
  background: var(--border);
}
[data-slot="button-group"][data-orientation="vertical"] [data-slot="separator"] {
  width: auto;
  height: var(--border-width);
}

/* Calendar recipe — contract slots only (contract/authoring.md step 3).
   Structure, states and motion: contract/anatomy/calendar.json.
   Cell size is bound to control-height-sm and radius-control — there is
   deliberately no size axis, because a calendar grid must stay square and a
   theme's density axis already moves control-height-sm. Character: the theme. */

/* root — one or more month panels side by side */
[data-slot="calendar"] {
  display: flex;
  flex-direction: column;
  gap: var(--space-stack-md);
  width: fit-content;
  padding: var(--inset-container);
  background: var(--surface);
  color: var(--on-surface);
  border: var(--border-width) solid var(--border);
  border-radius: var(--radius-container);
  font: var(--type-label);
}

/* nav — the previous/next row aligned with the caption */
[data-slot="calendar"] [data-slot="nav"] {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-inline-sm);
  height: var(--control-height-sm);
}

/* nav-previous / nav-next — back and forward icon roles */
[data-slot="calendar"] [data-slot="nav-previous"],
[data-slot="calendar"] [data-slot="nav-next"] {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: var(--control-height-sm);
  height: var(--control-height-sm);
  border: none;
  border-radius: var(--radius-control);
  background: transparent;
  color: var(--on-surface);
  cursor: var(--cursor-interactive);
  outline: none;
  transition: background-color var(--duration-fast) var(--easing-standard);
}
[data-slot="calendar"] [data-slot="nav-previous"]:hover,
[data-slot="calendar"] [data-slot="nav-next"]:hover {
  background: var(--interaction-hover);
}
[data-slot="calendar"] [data-slot="nav-previous"]:focus-visible,
[data-slot="calendar"] [data-slot="nav-next"]:focus-visible {
  outline: var(--focus-width) solid color-mix(in oklab, var(--focus) 60%, transparent);
  outline-offset: var(--focus-offset);
}
[data-slot="calendar"] [data-slot="nav-previous"] svg,
[data-slot="calendar"] [data-slot="nav-next"] svg {
  width: var(--icon-size-control);
  height: var(--icon-size-control);
}

/* caption — the month/year label; names the grid */
[data-slot="calendar"] [data-slot="caption"] {
  display: flex;
  align-items: center;
  justify-content: center;
  flex: 1;
  height: var(--control-height-sm);
  font: var(--type-label);
  color: var(--on-surface);
}

/* grid — role=grid for one month */
[data-slot="calendar"] [data-slot="grid"] {
  border-collapse: collapse;
  margin-block-start: var(--space-stack-sm);
}

/* weekday — abbreviated header; its full name is exposed to assistive tech */
[data-slot="calendar"] [data-slot="weekday"] {
  width: var(--control-height-sm);
  height: var(--control-height-sm);
  padding: 0;
  font: var(--type-caption);
  color: var(--content-secondary);
  text-align: center;
}

/* week-number */
[data-slot="calendar"] [data-slot="week-number"] {
  width: var(--control-height-sm);
  height: var(--control-height-sm);
  padding: 0;
  font: var(--type-caption);
  color: var(--content-secondary);
  text-align: center;
}

/* day — the gridcell; carries range position so the range fill can bleed
   edge to edge between cells */
[data-slot="calendar"] [data-slot="day"] {
  position: relative;
  width: var(--control-height-sm);
  height: var(--control-height-sm);
  padding: 0;
  text-align: center;
}
[data-slot="calendar"] [data-slot="day"][data-range="start"],
[data-slot="calendar"] [data-slot="day"][data-range="middle"],
[data-slot="calendar"] [data-slot="day"][data-range="end"] {
  background: color-mix(in oklab, var(--interaction-selected) 60%, var(--surface));
}
[data-slot="calendar"] [data-slot="day"][data-range="start"] {
  border-start-start-radius: var(--radius-control);
  border-end-start-radius: var(--radius-control);
}
[data-slot="calendar"] [data-slot="day"][data-range="end"] {
  border-start-end-radius: var(--radius-control);
  border-end-end-radius: var(--radius-control);
}

/* day-button */
[data-slot="calendar"] [data-slot="day-button"] {
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: var(--control-height-sm);
  height: var(--control-height-sm);
  border: none;
  border-radius: var(--radius-control);
  background: transparent;
  color: inherit;
  font: var(--type-label);
  cursor: var(--cursor-interactive);
  user-select: none;
  outline: none;
  transition:
    background-color var(--duration-fast) var(--easing-standard),
    color var(--duration-fast) var(--easing-standard);
}
[data-slot="calendar"] [data-slot="day-button"]:hover {
  background: var(--interaction-hover);
}
[data-slot="calendar"] [data-slot="day-button"]:focus-visible {
  outline: var(--focus-width) solid color-mix(in oklab, var(--focus) 60%, transparent);
  outline-offset: var(--focus-offset);
}
[data-slot="calendar"] [data-slot="day-button"][data-state="selected"] {
  background: var(--interaction-selected);
  color: var(--on-interaction-selected);
}

/* today is marked with selected-indicator, NOT with the selected recipe */
[data-slot="calendar"] [data-slot="day-button"][data-today]::after {
  content: "";
  position: absolute;
  inset-block-end: var(--space-unit);
  inset-inline-start: 50%;
  width: var(--space-unit);
  height: var(--space-unit);
  margin-inline-start: calc(var(--space-unit) * -0.5);
  border-radius: var(--radius-pill);
  background: var(--selected-indicator);
}
[data-slot="calendar"] [data-slot="day-button"][data-state="selected"][data-today]::after {
  background: var(--on-interaction-selected);
}

/* outside-month and unavailable days use content-disabled */
[data-slot="calendar"] [data-slot="day-button"][data-outside] {
  color: var(--content-disabled);
}
[data-slot="calendar"] [data-slot="day-button"][data-disabled] {
  color: var(--content-disabled);
  pointer-events: none;
  cursor: var(--cursor-disabled);
}

/* readonly — visible, not editable */
[data-slot="calendar"][data-readonly] [data-slot="day-button"] {
  cursor: default;
}
[data-slot="calendar"][data-readonly] [data-slot="day-button"]:hover {
  background: transparent;
}

/* names carried to assistive tech only */
[data-slot="calendar"] [data-slot="visually-hidden"] {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip-path: inset(50%);
  white-space: nowrap;
}

@media (prefers-reduced-motion: reduce) {
  [data-slot="calendar"] [data-slot="nav-previous"],
  [data-slot="calendar"] [data-slot="nav-next"],
  [data-slot="calendar"] [data-slot="day-button"] { transition: none; }
}

/* Card recipe — contract slots only (contract/authoring.md step 3).
   Structure and parts: contract/anatomy/card.json. Character: the theme.
   Padding lives on root as inset-container (anatomy note); elevation
   expression (shadow vs border) follows the theme's elevation-strategy.
   Lifted from shadcn/card.tsx via scripts/lift.py, then reviewed against
   the anatomy + button exemplar. Unmapped words: card.lift-report.json */

[data-slot="card"] {
  display: flex;
  flex-direction: column;
  gap: var(--space-stack-md);
  background: var(--surface-raised);
  color: var(--on-surface-raised);
  border: var(--border-width) solid var(--border);
  border-radius: var(--radius-container);
  padding: var(--inset-container);
  box-shadow: var(--elevation-raised);
}

/* header: title/description stack with trailing action-slot column */
[data-slot="card"] > [data-slot="header"] {
  display: grid;
  grid-auto-rows: min-content;
  align-items: start;
  row-gap: var(--space-stack-sm);
  column-gap: var(--space-inline-md);
}
[data-slot="card"] > [data-slot="header"]:has([data-slot="action-slot"]) {
  grid-template-columns: 1fr auto;
  grid-template-rows: auto auto;
}

[data-slot="card"] [data-slot="title"] {
  font: var(--type-heading-3);
  color: var(--on-surface-raised);
}

[data-slot="card"] [data-slot="description"] {
  font: var(--type-body);
  color: var(--content-secondary);
}

[data-slot="card"] [data-slot="action-slot"] {
  grid-column: 2;
  grid-row: 1 / span 2;
  justify-self: end;
  align-self: start;
}

[data-slot="card"] > [data-slot="content"] {
  font: var(--type-body);
}

[data-slot="card"] > [data-slot="footer"] {
  display: flex;
  align-items: center;
  gap: var(--space-inline-md);
}
/* optional divider above footer (anatomy note: border-subtle top rule) */
[data-slot="card"] > [data-slot="footer"][data-divider] {
  border-top: var(--border-width) solid var(--border-subtle);
  padding-top: var(--space-stack-md);
}

/* Carousel recipe — contract slots only (contract/authoring.md step 3).
   Structure and states: contract/anatomy/carousel.json. Character: the theme. */

[data-slot="carousel"] {
  position: relative;
  display: grid;
  gap: var(--space-inline-lg);
  outline: none;
}
[data-slot="carousel"]:focus-visible {
  outline: var(--focus-width) var(--focus-style) color-mix(in oklab, var(--focus) 60%, transparent);
  outline-offset: var(--focus-offset);
}

/* viewport — the clipping window; the only scroll container */
[data-slot="carousel"] [data-slot="viewport"] {
  overflow: hidden;
  border-radius: var(--radius-container);
}

/* slides — the moving rail */
[data-slot="carousel"] [data-slot="slides"] {
  display: flex;
  gap: var(--space-inline-lg);
  transition: transform var(--duration-base) var(--easing-emphasized);
}
[data-slot="carousel"][data-orientation="vertical"] [data-slot="slides"] {
  flex-direction: column;
}

/* slide */
[data-slot="carousel"] [data-slot="slide"] {
  flex: 0 0 100%;
  min-width: 0;
  border-radius: var(--radius-container);
  background: var(--surface-raised);
  color: var(--on-surface-raised);
}

/* previous / next — placement is a recipe: overlaid on the viewport edges */
[data-slot="carousel"] [data-slot="previous"],
[data-slot="carousel"] [data-slot="next"] {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: var(--control-height-md);
  height: var(--control-height-md);
  padding: 0;
  border: var(--border-width) solid var(--border);
  border-radius: var(--radius-pill);
  background: var(--surface);
  color: var(--on-surface);
  box-shadow: var(--elevation-resting);
  cursor: var(--cursor-interactive);
  outline: none;
  transition:
    background-color var(--duration-fast) var(--easing-standard),
    border-color var(--duration-fast) var(--easing-standard),
    opacity var(--duration-fast) var(--easing-standard);
}
[data-slot="carousel"] [data-slot="previous"] {
  inset-inline-start: 0;
}
[data-slot="carousel"] [data-slot="next"] {
  inset-inline-end: 0;
}
[data-slot="carousel"][data-orientation="vertical"] [data-slot="previous"] {
  top: 0;
  inset-inline: 50% auto;
  transform: translateX(-50%);
}
[data-slot="carousel"][data-orientation="vertical"] [data-slot="next"] {
  top: auto;
  bottom: 0;
  inset-inline: 50% auto;
  transform: translateX(-50%);
}
[data-slot="carousel"] [data-slot="previous"]:hover,
[data-slot="carousel"] [data-slot="next"]:hover {
  background: var(--target-surface-hover);
  border-color: var(--target-border-hover);
}
[data-slot="carousel"] [data-slot="previous"]:focus-visible,
[data-slot="carousel"] [data-slot="next"]:focus-visible {
  outline: var(--focus-width) var(--focus-style) color-mix(in oklab, var(--focus) 60%, transparent);
  outline-offset: var(--focus-offset);
}
[data-slot="carousel"] [data-slot="previous"][data-disabled],
[data-slot="carousel"] [data-slot="next"][data-disabled] {
  opacity: 0.5;
  cursor: var(--cursor-disabled);
}
[data-slot="carousel"] [data-slot="previous"] svg,
[data-slot="carousel"] [data-slot="next"] svg {
  width: var(--icon-size-control);
  height: var(--icon-size-control);
}
[data-slot="carousel"][data-orientation="vertical"] [data-slot="previous"] svg {
  transform: rotate(90deg);
}
[data-slot="carousel"][data-orientation="vertical"] [data-slot="next"] svg {
  transform: rotate(90deg);
}

/* indicator-list */
[data-slot="carousel"] [data-slot="indicator-list"] {
  display: flex;
  justify-content: center;
  gap: var(--space-inline-sm);
}
[data-slot="carousel"][data-orientation="vertical"] [data-slot="indicator-list"] {
  flex-direction: column;
  align-items: center;
}

/* indicator — the selected one changes size AND fill, never colour alone */
[data-slot="carousel"] [data-slot="indicator"] {
  width: var(--icon-size-inline);
  height: var(--icon-size-inline);
  padding: 0;
  border: var(--border-width) solid var(--border-strong);
  border-radius: var(--radius-pill);
  background: transparent;
  cursor: var(--cursor-interactive);
  outline: none;
  transition:
    background-color var(--duration-fast) var(--easing-standard),
    border-color var(--duration-fast) var(--easing-standard),
    width var(--duration-fast) var(--easing-standard);
}
[data-slot="carousel"] [data-slot="indicator"][data-state="selected"] {
  width: calc(var(--icon-size-inline) * 2.5);
  background: var(--selected-indicator);
  border-color: var(--selected-indicator);
}
[data-slot="carousel"][data-orientation="vertical"] [data-slot="indicator"][data-state="selected"] {
  width: var(--icon-size-inline);
  height: calc(var(--icon-size-inline) * 2.5);
}
[data-slot="carousel"] [data-slot="indicator"]:focus-visible {
  outline: var(--focus-width) var(--focus-style) color-mix(in oklab, var(--focus) 60%, transparent);
  outline-offset: var(--focus-offset);
}

/* progress-label — the visible "N of M" counter */
[data-slot="carousel"] [data-slot="progress-label"] {
  text-align: center;
  font: var(--type-caption);
  color: var(--content-secondary);
}

/* the polite announcement channel is never visible */
[data-slot="carousel"] [data-slot="live-region"] {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip-path: inset(50%);
  white-space: nowrap;
  border: 0;
}

@media (prefers-reduced-motion: reduce) {
  [data-slot="carousel"] [data-slot="slides"],
  [data-slot="carousel"] [data-slot="previous"],
  [data-slot="carousel"] [data-slot="next"],
  [data-slot="carousel"] [data-slot="indicator"] {
    transition: none;
  }
}

/* Chart recipe — contract slots only (contract/authoring.md step 3).
   Structure and states: contract/anatomy/chart.json. Character: the theme.
   The ordinal data-1..12 set is the only place numbered tokens are legal
   (contract/naming.md); the Nth series takes the Nth slot, in order. */

[data-slot="chart"] {
  display: grid;
  gap: var(--space-stack-sm);
  width: 100%;
  padding: var(--inset-container);
  border-radius: var(--radius-container);
  background: var(--surface);
  color: var(--on-surface);
  font: var(--type-caption);
}

[data-slot="chart"] [data-slot="plot"] {
  display: block;
  width: 100%;
  height: auto;
  overflow: visible;
}

/* plot-area — the data rectangle inside the axes */
[data-slot="chart"] [data-slot="plot-area"] {
  fill: none;
  stroke: var(--border-subtle);
  stroke-width: var(--border-width);
}

/* grid-line — always weaker than the axis */
[data-slot="chart"] [data-slot="grid-line"] {
  stroke: var(--border-subtle);
  stroke-width: var(--border-width);
  opacity: 0.6;
}

/* axis — the axis rule */
[data-slot="chart"] [data-slot="axis"] {
  stroke: var(--border);
  stroke-width: var(--border-width);
}

/* axis-tick — tick labels; numeric ticks use type-data so digits align */
[data-slot="chart"] [data-slot="axis-tick"] {
  font: var(--type-caption);
  fill: var(--content-secondary);
}
[data-slot="chart"] [data-slot="axis-tick"][data-axis="y"] {
  font: var(--type-data);
}

/* axis-label */
[data-slot="chart"] [data-slot="axis-label"] {
  font: var(--type-caption);
  fill: var(--content-secondary);
  color: var(--content-secondary);
}

/* series — colour arrives through currentColor so line, marker, bar and
   swatch all inherit the one ordinal slot */
[data-slot="chart"] [data-slot="series"] {
  transition: opacity var(--duration-slow) var(--easing-enter);
}
[data-slot="chart"] [data-slot="series"] [data-slot="series-line"] {
  fill: none;
  stroke: currentColor;
  stroke-width: calc(var(--border-width) * 2);
  stroke-linejoin: round;
  stroke-linecap: round;
}
[data-slot="chart"] [data-slot="series"] [data-slot="series-marker"] > * {
  fill: currentColor;
  stroke: var(--surface);
  stroke-width: var(--border-width);
}
[data-slot="chart"] [data-slot="series"] [data-slot="series-bar"] {
  fill: currentColor;
}

/* the ordinal palette */
[data-slot="chart"] [data-index="1"] { color: var(--data-1); }
[data-slot="chart"] [data-index="2"] { color: var(--data-2); }
[data-slot="chart"] [data-index="3"] { color: var(--data-3); }
[data-slot="chart"] [data-index="4"] { color: var(--data-4); }
[data-slot="chart"] [data-index="5"] { color: var(--data-5); }
[data-slot="chart"] [data-index="6"] { color: var(--data-6); }
[data-slot="chart"] [data-index="7"] { color: var(--data-7); }
[data-slot="chart"] [data-index="8"] { color: var(--data-8); }
[data-slot="chart"] [data-index="9"] { color: var(--data-9); }
[data-slot="chart"] [data-index="10"] { color: var(--data-10); }
[data-slot="chart"] [data-index="11"] { color: var(--data-11); }
[data-slot="chart"] [data-index="12"] { color: var(--data-12); }

/* legend */
[data-slot="chart"] [data-slot="legend"] {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: var(--space-inline-lg);
  font: var(--type-caption);
}

/* legend-item — a toggle button; a hidden series drops to content-disabled */
[data-slot="chart"] [data-slot="legend-item"] {
  display: inline-flex;
  align-items: center;
  gap: var(--space-inline-md);
  padding: 0;
  border: none;
  border-radius: var(--radius-control);
  background: transparent;
  font: var(--type-caption);
  color: var(--content-secondary);
  cursor: var(--cursor-interactive);
  outline: none;
  transition: color var(--duration-fast) var(--easing-standard);
}
[data-slot="chart"] [data-slot="legend-item"]:hover {
  color: var(--on-surface);
}
[data-slot="chart"] [data-slot="legend-item"]:focus-visible {
  outline: var(--focus-width) var(--focus-style) color-mix(in oklab, var(--focus) 60%, transparent);
  outline-offset: var(--focus-offset);
}
[data-slot="chart"] [data-slot="legend-item"][aria-pressed="false"] {
  color: var(--content-disabled);
}

/* legend-swatch — takes the same data slot as its series, and repeats the
   series' marker shape so the legend is not hue-only either */
[data-slot="chart"] [data-slot="legend-swatch"] {
  width: var(--icon-size-inline);
  height: var(--icon-size-inline);
  flex-shrink: 0;
  border-radius: var(--radius-field-control);
  background: currentColor;
}
[data-slot="chart"] [data-slot="legend-swatch"][data-marker="circle"] {
  border-radius: var(--radius-pill);
}
[data-slot="chart"] [data-slot="legend-swatch"][data-marker="triangle"] {
  border-radius: 0;
  clip-path: polygon(50% 0, 100% 100%, 0 100%);
}
[data-slot="chart"] [data-slot="legend-swatch"][data-marker="diamond"] {
  border-radius: 0;
  clip-path: polygon(50% 0, 100% 50%, 50% 100%, 0 50%);
}
[data-slot="chart"] [data-slot="legend-item"][aria-pressed="false"] [data-slot="legend-swatch"] {
  background: var(--content-disabled);
}

/* tooltip — follows the APG tooltip pattern; overlay chrome, tooltip layer */
[data-slot="chart"] [data-slot="tooltip"] {
  position: absolute;
  z-index: var(--layer-tooltip);
  padding: var(--inset-control-x);
  border: var(--border-width) solid var(--border);
  border-radius: var(--radius-overlay);
  background: var(--surface-overlay);
  color: var(--on-surface-overlay);
  box-shadow: var(--elevation-overlay);
  animation: chart-tooltip-enter var(--duration-fast) var(--easing-enter);
}
@keyframes chart-tooltip-enter {
  from { opacity: 0; }
  to { opacity: 1; }
}
[data-slot="chart"] [data-slot="tooltip-label"] {
  font: var(--type-caption);
  color: var(--content-secondary);
}
[data-slot="chart"] [data-slot="tooltip-item"] {
  display: flex;
  gap: var(--space-inline-md);
  font: var(--type-data);
}
[data-slot="chart"] [data-slot="tooltip-swatch"] {
  width: var(--icon-size-inline);
  height: var(--icon-size-inline);
  border-radius: var(--radius-field-control);
  background: currentColor;
}

/* data-table + the label/description carriers stay off-screen but readable */
[data-slot="chart"] [data-slot="data-table"],
[data-slot="chart"] [data-slot="visually-hidden"] {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip-path: inset(50%);
  white-space: nowrap;
  border: 0;
}

@media (prefers-reduced-motion: reduce) {
  [data-slot="chart"] [data-slot="series"],
  [data-slot="chart"] [data-slot="legend-item"] { transition: none; }
  [data-slot="chart"] [data-slot="tooltip"] { animation: none; }
}

/* Checkbox recipe — contract slots only. Anatomy: contract/anatomy/checkbox.json */

[data-slot="checkbox"] {
  display: inline-flex;
  align-items: flex-start;
  gap: var(--space-inline-md);
}
[data-slot="checkbox"] [data-slot="control"] {
  display: inline-grid;
  place-items: center;
  flex-shrink: 0;
  width: var(--icon-size-control);
  height: var(--icon-size-control);
  margin-block-start: calc(var(--space-unit) * 0.5);
  padding: 0;
  background: var(--field-surface);
  color: var(--on-action);
  border: var(--border-width) solid var(--field-border);
  border-radius: var(--radius-field-control);
  cursor: var(--cursor-interactive);
  transition:
    background-color var(--duration-fast) var(--easing-standard),
    border-color var(--duration-fast) var(--easing-standard);
}
[data-slot="checkbox"] [data-slot="control"]:hover { border-color: var(--field-border-hover); background: var(--field-surface-hover); }
[data-slot="checkbox"] [data-slot="control"][data-state="selected"],
[data-slot="checkbox"] [data-slot="control"][data-state="indeterminate"] {
  background: var(--action);
  border-color: var(--action);
}
[data-slot="checkbox"] [data-slot="control"]:focus-visible {
  outline: var(--focus-width) solid color-mix(in oklab, var(--focus) 50%, transparent);
  outline-offset: var(--focus-offset);
}
[data-slot="checkbox"] [data-slot="control"][aria-invalid="true"] { border-color: var(--status-critical); }
[data-slot="checkbox"] [data-slot="control"][aria-readonly="true"] { background: var(--surface-sunken); cursor: default; }
[data-slot="checkbox"][data-disabled] { opacity: 0.5; pointer-events: none; cursor: var(--cursor-disabled); }
[data-slot="checkbox"] [data-slot="indicator"] { display: inline-flex; }
[data-slot="checkbox"] [data-slot="indicator"] svg { width: var(--icon-size-inline); height: var(--icon-size-inline); }
[data-slot="checkbox"] [data-slot="text"] { display: inline-flex; flex-direction: column; gap: calc(var(--space-unit) * 0.5); }
[data-slot="checkbox"] [data-slot="label"] { font: var(--type-label); cursor: var(--cursor-interactive); }
[data-slot="checkbox"] [data-slot="description"] { font: var(--type-caption); color: var(--content-secondary); }
@media (prefers-reduced-motion: reduce) { [data-slot="checkbox"] [data-slot="control"] { transition: none; } }

/* Collapsible recipe — contract slots only (contract/authoring.md step 3).
   Structure, states and motion: contract/anatomy/collapsible.json.
   The root contributes no visual recipe — it only owns the open state. */

[data-slot="collapsible"] {
  display: block;
}

/* trigger */
[data-slot="collapsible"] > [data-slot="trigger"] {
  display: inline-flex;
  align-items: center;
  gap: var(--space-inline-sm);
  padding: 0;
  border: none;
  border-radius: var(--radius-control);
  background: transparent;
  color: var(--on-surface);
  font: var(--type-label);
  text-align: start;
  cursor: var(--cursor-interactive);
}
[data-slot="collapsible"] > [data-slot="trigger"]:focus-visible {
  outline: var(--focus-width) var(--focus-style)
    color-mix(in oklab, var(--focus) 60%, transparent);
  outline-offset: var(--focus-offset);
}
[data-slot="collapsible"] > [data-slot="trigger"][data-disabled],
[data-slot="collapsible"] > [data-slot="trigger"]:disabled {
  opacity: 0.5;
  pointer-events: none;
  cursor: var(--cursor-disabled);
}

/* panel — grid-rows collapse animates to the intrinsic content height */
[data-slot="collapsible"] > [data-slot="panel"] {
  display: grid;
  grid-template-rows: 0fr;
  overflow: hidden;
  font: var(--type-body);
  transition: grid-template-rows var(--duration-fast) var(--easing-exit);
}
[data-slot="collapsible"] > [data-slot="panel"] > * {
  min-height: 0;
}
[data-slot="collapsible"] > [data-slot="panel"][data-state="open"] {
  grid-template-rows: 1fr;
  transition: grid-template-rows var(--duration-base) var(--easing-standard);
}
[data-slot="collapsible"] > [data-slot="panel"][data-state="open"] > * {
  padding-block-start: var(--space-stack-sm);
}

@media (prefers-reduced-motion: reduce) {
  [data-slot="collapsible"] > [data-slot="panel"] { transition: none; }
}

/* Command recipe — contract slots only (contract/authoring.md step 3).
   Structure, states and motion: contract/anatomy/command.json.
   The ACTIVE option (aria-activedescendant) takes interaction-hover; a CHOSEN
   option takes interaction-selected — the two must stay distinguishable.
   Character: the theme. */

/* root — the palette panel */
[data-slot="command"] {
  display: flex;
  flex-direction: column;
  width: 100%;
  max-width: var(--size-overlay-md);
  overflow: hidden;
  background: var(--surface-overlay);
  color: var(--on-surface-overlay);
  border: var(--border-width) solid var(--border);
  border-radius: var(--radius-overlay);
  box-shadow: var(--elevation-overlay);
  z-index: var(--layer-modal);
}
[data-slot="command"][data-state="open"] {
  animation: command-panel-enter var(--duration-fast) var(--easing-enter);
}
@keyframes command-panel-enter {
  from { opacity: 0; transform: scale(0.98); }
  to { opacity: 1; transform: scale(1); }
}

/* input-row — search icon + input, ruled off from the list */
[data-slot="command"] [data-slot="input-row"] {
  display: flex;
  align-items: center;
  gap: var(--space-inline-md);
  height: var(--control-height-lg);
  padding-inline: var(--inset-control-x);
  border-block-end: var(--border-width) solid var(--border);
}

/* search-icon */
[data-slot="command"] [data-slot="search-icon"] {
  display: inline-flex;
  flex-shrink: 0;
  color: var(--content-secondary);
}
[data-slot="command"] [data-slot="search-icon"] svg {
  width: var(--icon-size-control);
  height: var(--icon-size-control);
}

/* input — the combobox */
[data-slot="command"] [data-slot="input"] {
  flex: 1;
  min-width: 0;
  height: 100%;
  border: none;
  background: transparent;
  color: var(--on-surface-overlay);
  font: var(--type-label);
  outline: none;
}
[data-slot="command"] [data-slot="input"]::placeholder {
  color: var(--content-secondary);
}

/* list — role=listbox; scrolls the active option into view */
[data-slot="command"] [data-slot="list"] {
  max-height: var(--size-overlay-sm);
  overflow-x: hidden;
  overflow-y: auto;
  padding: var(--space-unit);
}

/* group */
[data-slot="command"] [data-slot="group"] {
  padding-block: var(--space-unit);
}

/* group-label */
[data-slot="command"] [data-slot="group-label"] {
  padding-inline: var(--space-inline-md);
  padding-block: var(--space-inline-sm);
  font: var(--type-caption);
  color: var(--content-secondary);
}

/* item */
[data-slot="command"] [data-slot="item"] {
  display: flex;
  align-items: center;
  gap: var(--space-inline-md);
  min-height: var(--control-height-sm);
  padding-inline: var(--space-inline-md);
  padding-block: var(--space-inline-sm);
  border-radius: var(--radius-control);
  font: var(--type-label);
  cursor: var(--cursor-interactive);
  user-select: none;
  transition:
    background-color var(--duration-fast) var(--easing-standard),
    color var(--duration-fast) var(--easing-standard);
}

/* ACTIVE — virtual focus */
[data-slot="command"] [data-slot="item"][data-active] {
  background: var(--interaction-hover);
}

/* SELECTED — a chosen option; must remain distinguishable from active */
[data-slot="command"] [data-slot="item"][data-state="selected"] {
  background: var(--interaction-selected);
  color: var(--on-interaction-selected);
}
[data-slot="command"] [data-slot="item"][data-state="selected"][data-active] {
  box-shadow: inset 0 0 0 var(--border-width-strong) var(--selected-indicator);
}

[data-slot="command"] [data-slot="item"][data-disabled] {
  opacity: 0.5;
  pointer-events: none;
  cursor: var(--cursor-disabled);
}

/* item-icon */
[data-slot="command"] [data-slot="item-icon"] {
  display: inline-flex;
  flex-shrink: 0;
  color: var(--content-secondary);
}
[data-slot="command"] [data-slot="item-icon"] svg {
  width: var(--icon-size-control);
  height: var(--icon-size-control);
}

/* item-label */
[data-slot="command"] [data-slot="item-label"] {
  flex: 1;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font: var(--type-label);
}

/* item-shortcut */
[data-slot="command"] [data-slot="item-shortcut"] {
  flex-shrink: 0;
  margin-inline-start: auto;
  font: var(--type-caption);
  color: var(--content-secondary);
}

/* separator */
[data-slot="command"] [data-slot="separator"] {
  height: var(--border-width);
  margin-block: var(--space-unit);
  margin-inline: calc(var(--space-unit) * -1);
  background: var(--border);
}

/* empty — the no-results message */
[data-slot="command"] [data-slot="empty"] {
  padding-block: var(--space-stack-lg);
  text-align: center;
  font: var(--type-body);
  color: var(--content-secondary);
}

/* the polite live region carrying the result count */
[data-slot="command"] [data-slot="live-region"] {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip-path: inset(50%);
  white-space: nowrap;
}

@media (prefers-reduced-motion: reduce) {
  [data-slot="command"][data-state="open"] { animation: none; }
  [data-slot="command"] [data-slot="item"] { transition: none; }
}

/* Context-menu recipe — contract slots only (contract/authoring.md step 3).
   Structure and states: contract/anatomy/context-menu.json. Character: the theme.

   The parts are dropdown-menu's parts; the recipe differs only where
   invocation and anchoring differ — the trigger is a bare region and the
   panel is positioned at the pointer (inline top/left set by the component),
   not against a trigger edge. */

/* trigger — the target region: focusable, but carries no visible chrome */
[data-slot="context-menu"] [data-slot="trigger"][data-invocation="context"] {
  outline: none;
}
[data-slot="context-menu"] [data-slot="trigger"][data-invocation="context"]:focus-visible {
  outline: var(--focus-width) var(--focus-style) color-mix(in oklab, var(--focus) 60%, transparent);
  outline-offset: var(--focus-offset);
}

/* panel */
[data-slot="context-menu"] [data-slot="panel"][role="menu"] {
  position: fixed;
  z-index: var(--layer-dropdown);
  display: flex;
  flex-direction: column;
  gap: var(--space-unit);
  min-width: var(--size-overlay-sm);
  width: max-content;
  padding: var(--space-unit);
  border: var(--border-width) solid var(--border);
  border-radius: var(--radius-overlay);
  background: var(--surface-overlay);
  color: var(--on-surface-overlay);
  box-shadow: var(--elevation-overlay);
  outline: none;
}

/* item */
[data-slot="context-menu"] [data-slot="panel"][role="menu"] [data-slot="item"] {
  display: flex;
  align-items: center;
  gap: var(--space-inline-md);
  min-height: var(--target-min);
  padding-block: var(--space-unit);
  padding-inline: var(--space-inline-md);
  border-radius: var(--radius-control);
  font: var(--type-label);
  color: var(--on-surface-overlay);
  cursor: var(--cursor-interactive);
  outline: none;
  transition:
    background-color var(--duration-fast) var(--easing-standard),
    color var(--duration-fast) var(--easing-standard);
}
[data-slot="context-menu"] [data-slot="panel"][role="menu"] [data-slot="item"]:hover,
[data-slot="context-menu"] [data-slot="panel"][role="menu"] [data-slot="item"]:focus-visible {
  background: var(--interaction-hover);
}
[data-slot="context-menu"] [data-slot="panel"][role="menu"] [data-slot="item"]:active {
  background: var(--interaction-active);
}
[data-slot="context-menu"] [data-slot="panel"][role="menu"] [data-slot="item"]:focus-visible {
  outline: var(--focus-width) var(--focus-style) color-mix(in oklab, var(--focus) 60%, transparent);
  outline-offset: calc(var(--focus-offset) * -1);
}
[data-slot="context-menu"] [data-slot="panel"][role="menu"] [data-slot="item"][data-disabled] {
  opacity: 0.5;
  pointer-events: none;
  cursor: var(--cursor-disabled);
}

/* destructive items carry emphasis at item level */
[data-slot="context-menu"] [data-slot="panel"][role="menu"] [data-slot="item"][data-emphasis="danger"] {
  color: var(--status-critical);
}
[data-slot="context-menu"] [data-slot="panel"][role="menu"] [data-slot="item"][data-emphasis="danger"]:hover {
  background: var(--status-critical-surface);
}

/* item-icon */
[data-slot="context-menu"] [data-slot="panel"][role="menu"] [data-slot="item-icon"] {
  display: inline-flex;
  flex-shrink: 0;
  margin-inline-end: var(--space-inline-sm);
}
[data-slot="context-menu"] [data-slot="panel"][role="menu"] [data-slot="item-icon"] svg {
  width: var(--icon-size-inline);
  height: var(--icon-size-inline);
}

/* item-label — the content slot */
[data-slot="context-menu"] [data-slot="panel"][role="menu"] [data-slot="item-label"] {
  flex: 1;
  font: var(--type-label);
}

/* item-shortcut — type-data keeps key names from jittering row to row */
[data-slot="context-menu"] [data-slot="panel"][role="menu"] [data-slot="item-shortcut"] {
  font: var(--type-data);
  color: var(--content-secondary);
}

/* separator */
[data-slot="context-menu"] [data-slot="panel"][role="menu"] [data-slot="separator"] {
  height: var(--border-width);
  margin-block: var(--space-unit);
  border: none;
  background: var(--border-subtle);
}

/* group-label */
[data-slot="context-menu"] [data-slot="panel"][role="menu"] [data-slot="group-label"] {
  padding-block: var(--space-unit);
  padding-inline: var(--space-inline-md);
  font: var(--type-caption);
  color: var(--content-secondary);
}

/* motion — enter duration-fast/easing-enter (anatomy motion block) */
[data-slot="context-menu"] [data-slot="panel"][role="menu"][data-state="open"] {
  animation: context-menu-panel-enter var(--duration-fast) var(--easing-enter);
}
@keyframes context-menu-panel-enter {
  from { opacity: 0; transform: scale(0.98); }
  to { opacity: 1; transform: scale(1); }
}

@media (prefers-reduced-motion: reduce) {
  [data-slot="context-menu"] [data-slot="panel"][role="menu"][data-state="open"] { animation: none; }
  [data-slot="context-menu"] [data-slot="panel"][role="menu"] [data-slot="item"] { transition: none; }
}

/* Dialog recipe — contract slots only (contract/authoring.md step 3).
   LIFTED from shadcn/dialog.tsx via scripts/lift.py, then reviewed against
   contract/anatomy/dialog.json + the button exemplar.
   Unmapped words: see dialog.lift-report.json */

/* scrim */
[data-slot="dialog"] [data-slot="scrim"] {
  position: fixed;
  inset: 0;
  z-index: var(--layer-modal);
  background: var(--overlay-scrim);
}
[data-slot="dialog"] [data-slot="scrim"][data-state="open"] {
  animation: dialog-scrim-fade var(--duration-base) var(--easing-standard);
}
@keyframes dialog-scrim-fade {
  from { opacity: 0; }
  to { opacity: 1; }
}

/* panel — size axis binds to the size-overlay-* width ramp (anatomyNotes) */
[data-slot="dialog"] [data-slot="panel"] {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  z-index: var(--layer-modal);
  display: flex;
  flex-direction: column;
  gap: var(--space-stack-md);
  width: calc(100% - var(--inset-container) * 2);
  max-width: var(--size-overlay-md);
  max-height: calc(100% - var(--inset-container) * 2);
  overflow-y: auto;
  padding: var(--inset-container);
  background: var(--surface-overlay);
  color: var(--on-surface-overlay);
  border: var(--border-width) solid var(--border);
  border-radius: var(--radius-overlay);
  box-shadow: var(--elevation-modal);
  outline: none;
}
[data-slot="dialog"] [data-slot="panel"][data-size="sm"] { max-width: var(--size-overlay-sm); }
[data-slot="dialog"] [data-slot="panel"][data-size="lg"] { max-width: var(--size-overlay-lg); }
[data-slot="dialog"] [data-slot="panel"][data-state="open"] {
  animation: dialog-panel-enter var(--duration-base) var(--easing-enter);
}
@keyframes dialog-panel-enter {
  from { opacity: 0; transform: translate(-50%, -50%) scale(0.95); }
  to { opacity: 1; transform: translate(-50%, -50%) scale(1); }
}

/* header */
[data-slot="dialog"] [data-slot="panel"] [data-slot="header"] {
  display: flex;
  flex-direction: column;
  gap: var(--space-stack-sm);
}

/* title */
[data-slot="dialog"] [data-slot="panel"] [data-slot="title"] {
  margin: 0;
  font: var(--type-heading-3);
  color: var(--on-surface-overlay);
}

/* description */
[data-slot="dialog"] [data-slot="panel"] [data-slot="description"] {
  margin: 0;
  font: var(--type-body);
  color: var(--content-secondary);
}

/* content */
[data-slot="dialog"] [data-slot="panel"] [data-slot="content"] {
  font: var(--type-body);
}

/* footer — action slot; end-aligned, stacks on narrow viewports */
[data-slot="dialog"] [data-slot="panel"] [data-slot="footer"] {
  display: flex;
  justify-content: flex-end;
  gap: var(--space-inline-md);
}
@media (max-width: 480px) {
  [data-slot="dialog"] [data-slot="panel"] [data-slot="footer"] {
    flex-direction: column-reverse;
  }
}

/* close — close icon role */
[data-slot="dialog"] [data-slot="panel"] [data-slot="close"] {
  position: absolute;
  top: calc(var(--space-unit) * 4);
  inset-inline-end: calc(var(--space-unit) * 4);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: var(--space-unit);
  border: none;
  border-radius: var(--radius-control);
  background: transparent;
  color: var(--content-secondary);
  cursor: var(--cursor-interactive);
  outline: none;
  transition:
    background-color var(--duration-fast) var(--easing-standard),
    color var(--duration-fast) var(--easing-standard);
}
[data-slot="dialog"] [data-slot="panel"] [data-slot="close"]:hover {
  background: var(--interaction-hover);
  color: var(--on-surface-overlay);
}
[data-slot="dialog"] [data-slot="panel"] [data-slot="close"]:focus-visible {
  outline: var(--focus-width) solid color-mix(in oklab, var(--focus) 60%, transparent);
  outline-offset: var(--focus-offset);
}
[data-slot="dialog"] [data-slot="panel"] [data-slot="close"] svg {
  width: var(--icon-size-control);
  height: var(--icon-size-control);
}

@media (prefers-reduced-motion: reduce) {
  [data-slot="dialog"] [data-slot="scrim"][data-state="open"],
  [data-slot="dialog"] [data-slot="panel"][data-state="open"] { animation: none; }
  [data-slot="dialog"] [data-slot="panel"] [data-slot="close"] { transition: none; }
}

/* Drawer recipe — contract slots only (contract/authoring.md step 3).
   Structure and states: contract/anatomy/drawer.json. Character: the theme.

   The panel is selected through its edge axis so an edge-anchored drawer and
   a centred dialog never collide on the shared slot names. */

/* scrim */
[data-slot="drawer"] [data-slot="scrim"] {
  position: fixed;
  inset: 0;
  z-index: var(--layer-modal);
  background: var(--overlay-scrim);
}
[data-slot="drawer"] [data-slot="scrim"][data-state="open"] {
  animation: drawer-scrim-fade var(--duration-base) var(--easing-standard);
}
@keyframes drawer-scrim-fade {
  from { opacity: 0; }
  to { opacity: 1; }
}

/* panel — anchored to one viewport edge */
[data-slot="drawer"] [data-slot="panel"][data-edge] {
  position: fixed;
  z-index: var(--layer-modal);
  display: flex;
  flex-direction: column;
  gap: var(--space-stack-md);
  padding: var(--inset-container);
  background: var(--surface-overlay);
  color: var(--on-surface-overlay);
  border: var(--border-width) solid var(--border);
  box-shadow: var(--elevation-modal);
  outline: none;
}

/* edge axis — placement, the anchored-edge-normal dimension, and the
   per-corner radius rule: radius-overlay on the corners OPPOSITE the anchored
   edge only. Logical edge names survive RTL. */
[data-slot="drawer"] [data-slot="panel"][data-edge="bottom"] {
  inset-inline: 0;
  bottom: 0;
  height: var(--size-overlay-md);
  max-height: 100%;
  border-start-start-radius: var(--radius-overlay);
  border-start-end-radius: var(--radius-overlay);
}
[data-slot="drawer"] [data-slot="panel"][data-edge="top"] {
  inset-inline: 0;
  top: 0;
  height: var(--size-overlay-md);
  max-height: 100%;
  border-end-start-radius: var(--radius-overlay);
  border-end-end-radius: var(--radius-overlay);
}
[data-slot="drawer"] [data-slot="panel"][data-edge="start"] {
  inset-block: 0;
  inset-inline-start: 0;
  width: var(--size-overlay-md);
  max-width: 100%;
  border-start-end-radius: var(--radius-overlay);
  border-end-end-radius: var(--radius-overlay);
}
[data-slot="drawer"] [data-slot="panel"][data-edge="end"] {
  inset-block: 0;
  inset-inline-end: 0;
  width: var(--size-overlay-md);
  max-width: 100%;
  border-start-start-radius: var(--radius-overlay);
  border-end-start-radius: var(--radius-overlay);
}

/* size axis — binds along the anchored-edge-normal dimension */
[data-slot="drawer"] [data-slot="panel"][data-edge="bottom"][data-size="sm"],
[data-slot="drawer"] [data-slot="panel"][data-edge="top"][data-size="sm"] {
  height: var(--size-overlay-sm);
}
[data-slot="drawer"] [data-slot="panel"][data-edge="bottom"][data-size="lg"],
[data-slot="drawer"] [data-slot="panel"][data-edge="top"][data-size="lg"] {
  height: var(--size-overlay-lg);
}
[data-slot="drawer"] [data-slot="panel"][data-edge="start"][data-size="sm"],
[data-slot="drawer"] [data-slot="panel"][data-edge="end"][data-size="sm"] {
  width: var(--size-overlay-sm);
}
[data-slot="drawer"] [data-slot="panel"][data-edge="start"][data-size="lg"],
[data-slot="drawer"] [data-slot="panel"][data-edge="end"][data-size="lg"] {
  width: var(--size-overlay-lg);
}

/* handle — the drag affordance */
[data-slot="drawer"] [data-slot="panel"][data-edge] [data-slot="handle"] {
  align-self: center;
  flex-shrink: 0;
  width: calc(var(--space-unit) * 9);
  height: var(--space-unit);
  border-radius: var(--radius-pill);
  background: var(--border-strong);
  cursor: var(--cursor-grab);
  touch-action: none;
}

/* header — title plus optional description */
[data-slot="drawer"] [data-slot="panel"][data-edge] [data-slot="header"] {
  display: flex;
  flex-direction: column;
  gap: var(--space-stack-sm);
}
[data-slot="drawer"] [data-slot="panel"][data-edge] [data-slot="title"] {
  margin: 0;
  font: var(--type-heading-3);
  color: var(--on-surface-overlay);
}
[data-slot="drawer"] [data-slot="panel"][data-edge] [data-slot="description"] {
  margin: 0;
  font: var(--type-body);
  color: var(--content-secondary);
}

/* content */
[data-slot="drawer"] [data-slot="panel"][data-edge] [data-slot="content"] {
  flex: 1;
  overflow-y: auto;
  font: var(--type-body);
}

/* footer — action slot; hosts buttons */
[data-slot="drawer"] [data-slot="panel"][data-edge] [data-slot="footer"] {
  display: flex;
  justify-content: flex-end;
  gap: var(--space-inline-md);
}

/* motion — panel-enter duration-base/easing-enter (anatomy motion block) */
[data-slot="drawer"] [data-slot="panel"][data-edge="bottom"][data-state="open"] {
  animation: drawer-enter-bottom var(--duration-base) var(--easing-enter);
}
[data-slot="drawer"] [data-slot="panel"][data-edge="top"][data-state="open"] {
  animation: drawer-enter-top var(--duration-base) var(--easing-enter);
}
[data-slot="drawer"] [data-slot="panel"][data-edge="start"][data-state="open"] {
  animation: drawer-enter-start var(--duration-base) var(--easing-enter);
}
[data-slot="drawer"] [data-slot="panel"][data-edge="end"][data-state="open"] {
  animation: drawer-enter-end var(--duration-base) var(--easing-enter);
}
@keyframes drawer-enter-bottom {
  from { transform: translateY(100%); }
  to { transform: translateY(0); }
}
@keyframes drawer-enter-top {
  from { transform: translateY(-100%); }
  to { transform: translateY(0); }
}
@keyframes drawer-enter-start {
  from { transform: translateX(-100%); }
  to { transform: translateX(0); }
}
@keyframes drawer-enter-end {
  from { transform: translateX(100%); }
  to { transform: translateX(0); }
}

/* dragging — the panel rides the pointer, so no transition fights it */
[data-slot="drawer"] [data-slot="panel"][data-edge][data-state="dragging"] {
  animation: none;
  transition: none;
  box-shadow: var(--elevation-overlay);
}
[data-slot="drawer"] [data-slot="panel"][data-edge][data-state="dragging"] [data-slot="handle"] {
  background: var(--selected-indicator);
}

@media (prefers-reduced-motion: reduce) {
  [data-slot="drawer"] [data-slot="scrim"][data-state="open"],
  [data-slot="drawer"] [data-slot="panel"][data-edge][data-state="open"] { animation: none; }
}

/* Dropdown menu recipe — contract slots only (contract/authoring.md step 3).
   Structure, states and motion: contract/anatomy/dropdown-menu.json.
   Character: the theme. */

[data-slot="dropdown-menu"] {
  position: relative;
  display: inline-block;
}

/* trigger — chrome delegated to anatomy/button.json */
[data-slot="dropdown-menu"] [data-slot="trigger"] {
  display: inline-flex;
  align-items: center;
  gap: var(--space-inline-md);
  height: var(--control-height-md);
  padding: 0 var(--inset-control-x);
  border: var(--border-width) solid var(--border);
  border-radius: var(--radius-control);
  background: transparent;
  color: var(--on-surface);
  font: var(--type-action);
  text-transform: var(--action-case);
  letter-spacing: var(--action-tracking);
  cursor: var(--cursor-interactive);
  outline: none;
  transition:
    background-color var(--duration-fast) var(--easing-standard),
    color var(--duration-fast) var(--easing-standard);
}
[data-slot="dropdown-menu"] [data-slot="trigger"]:hover {
  background: var(--interaction-hover);
}
[data-slot="dropdown-menu"] [data-slot="trigger"][data-state="open"] {
  background: var(--interaction-selected);
  color: var(--on-interaction-selected);
}
[data-slot="dropdown-menu"] [data-slot="trigger"]:focus-visible {
  outline: var(--focus-width) solid color-mix(in oklab, var(--focus) 60%, transparent);
  outline-offset: var(--focus-offset);
}
[data-slot="dropdown-menu"] [data-slot="trigger"][data-disabled] {
  opacity: 0.5;
  pointer-events: none;
  cursor: var(--cursor-disabled);
}

/* trigger-icon — expand icon role, rotates on open */
[data-slot="dropdown-menu"] [data-slot="trigger-icon"] {
  display: inline-flex;
  transition: transform var(--duration-fast) var(--easing-standard);
}
[data-slot="dropdown-menu"] [data-slot="trigger-icon"] svg {
  width: var(--icon-size-inline);
  height: var(--icon-size-inline);
}
[data-slot="dropdown-menu"] [data-slot="trigger"][data-state="open"] [data-slot="trigger-icon"] {
  transform: rotate(180deg);
}

/* panel */
[data-slot="dropdown-menu"] [data-slot="panel"] {
  position: absolute;
  inset-inline-start: 0;
  inset-block-start: calc(100% + var(--space-inline-sm));
  z-index: var(--layer-dropdown);
  min-width: var(--size-overlay-sm);
  max-width: 100%;
  padding: var(--space-unit);
  background: var(--surface-overlay);
  color: var(--on-surface-overlay);
  border: var(--border-width) solid var(--border);
  border-radius: var(--radius-overlay);
  box-shadow: var(--elevation-overlay);
  outline: none;
}
[data-slot="dropdown-menu"] [data-slot="panel"][data-state="open"] {
  animation: dropdown-menu-panel-enter var(--duration-fast) var(--easing-enter);
}
@keyframes dropdown-menu-panel-enter {
  from { opacity: 0; transform: translateY(calc(var(--space-unit) * -1)); }
  to { opacity: 1; transform: translateY(0); }
}

/* item */
[data-slot="dropdown-menu"] [data-slot="item"] {
  display: flex;
  align-items: center;
  gap: var(--space-inline-md);
  min-height: var(--control-height-sm);
  padding-inline: var(--space-inline-md);
  padding-block: var(--space-inline-sm);
  border-radius: var(--radius-control);
  font: var(--type-label);
  cursor: var(--cursor-interactive);
  user-select: none;
  outline: none;
  transition: background-color var(--duration-fast) var(--easing-standard);
}
[data-slot="dropdown-menu"] [data-slot="item"]:hover,
[data-slot="dropdown-menu"] [data-slot="item"]:focus {
  background: var(--interaction-hover);
}
[data-slot="dropdown-menu"] [data-slot="item"]:active {
  background: var(--interaction-active);
}
[data-slot="dropdown-menu"] [data-slot="item"]:focus-visible {
  outline: var(--focus-width) solid color-mix(in oklab, var(--focus) 60%, transparent);
  outline-offset: calc(var(--focus-offset) - var(--border-width));
}
[data-slot="dropdown-menu"] [data-slot="item"][data-disabled] {
  opacity: 0.5;
  pointer-events: none;
  cursor: var(--cursor-disabled);
}

/* a destructive item is emphasis:danger at item level — no extra part */
[data-slot="dropdown-menu"] [data-slot="item"][data-emphasis="danger"] {
  color: var(--status-critical);
}
[data-slot="dropdown-menu"] [data-slot="item"][data-emphasis="danger"]:hover,
[data-slot="dropdown-menu"] [data-slot="item"][data-emphasis="danger"]:focus {
  background: var(--status-critical-surface);
}

/* item-icon */
[data-slot="dropdown-menu"] [data-slot="item-icon"] {
  display: inline-flex;
  flex-shrink: 0;
  color: var(--content-secondary);
}
[data-slot="dropdown-menu"] [data-slot="item-icon"] svg {
  width: var(--icon-size-inline);
  height: var(--icon-size-inline);
}
[data-slot="dropdown-menu"] [data-slot="item"][data-emphasis="danger"] [data-slot="item-icon"] {
  color: var(--status-critical);
}

/* item-label */
[data-slot="dropdown-menu"] [data-slot="item-label"] {
  flex: 1;
  min-width: 0;
  font: var(--type-label);
}

/* item-shortcut */
[data-slot="dropdown-menu"] [data-slot="item-shortcut"] {
  flex-shrink: 0;
  margin-inline-start: auto;
  font: var(--type-data);
  color: var(--content-secondary);
}

/* separator */
[data-slot="dropdown-menu"] [data-slot="separator"] {
  height: var(--border-width);
  margin-block: var(--space-unit);
  margin-inline: calc(var(--space-unit) * -1);
  background: var(--border-subtle);
}

/* group-label */
[data-slot="dropdown-menu"] [data-slot="group-label"] {
  padding-inline: var(--space-inline-md);
  padding-block: var(--space-inline-sm);
  font: var(--type-caption);
  color: var(--content-secondary);
}

@media (prefers-reduced-motion: reduce) {
  [data-slot="dropdown-menu"] [data-slot="panel"][data-state="open"] { animation: none; }
  [data-slot="dropdown-menu"] [data-slot="trigger"],
  [data-slot="dropdown-menu"] [data-slot="trigger-icon"],
  [data-slot="dropdown-menu"] [data-slot="item"] { transition: none; }
}

/* Empty recipe — contract slots only (contract/authoring.md step 3).
   Structure: contract/anatomy/empty.json. The part list is deliberately
   parallel to card so the two containers translate onto each other. */

[data-slot="empty"] {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: var(--space-stack-lg);
  width: 100%;
  padding: var(--inset-container);
  border: var(--border-width) var(--border-style-emphasis) var(--border);
  border-radius: var(--radius-container);
