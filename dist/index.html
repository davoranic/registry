   Structure, size axis, states and motion: contract/anatomy/input-otp.json.
   A cell is a one-character input face and reuses field-border /
   field-surface / radius-control exactly, so no theme needs a new slot.
   Rounding every cell is this recipe's choice; a segmented-strip theme
   rounds only the group's outer corners — the same parts either way. */

[data-slot="input-otp"] {
  position: relative;
  display: inline-flex;
  align-items: center;
  gap: var(--space-inline-md);
  width: fit-content;
}

/* control — the one real input: it owns the value, the focus and the tab
   stop, and lies invisible over the cells */
[data-slot="input-otp"] > [data-slot="control"] {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  padding: 0;
  border: none;
  background: transparent;
  color: transparent;
  caret-color: transparent;
  letter-spacing: 100%;
  outline: none;
  opacity: 0;
}

/* group — a run of adjacent cells */
[data-slot="input-otp"] [data-slot="group"] {
  display: flex;
  align-items: center;
  gap: var(--space-inline-sm);
}

/* cell */
[data-slot="input-otp"] [data-slot="cell"] {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  width: var(--control-height-md);
  height: var(--control-height-md);
  border: var(--border-width) solid var(--field-border);
  border-radius: var(--radius-control);
  background: var(--field-surface);
  color: var(--on-surface);
  font: var(--type-label);
  transition:
    border-color var(--duration-fast) var(--easing-standard),
    background-color var(--duration-fast) var(--easing-standard);
}

/* size axis */
[data-slot="input-otp"][data-size="sm"] [data-slot="cell"] {
  width: var(--control-height-sm);
  height: var(--control-height-sm);
}
[data-slot="input-otp"][data-size="lg"] [data-slot="cell"] {
  width: var(--control-height-lg);
  height: var(--control-height-lg);
}

/* caret — the blinking bar on the active empty cell; decorative */
[data-slot="input-otp"] [data-slot="caret"] {
  position: absolute;
  width: var(--border-width-strong);
  height: 50%;
  background: var(--on-surface);
  animation: input-otp-caret-blink var(--duration-slow) var(--easing-standard) infinite;
}
@keyframes input-otp-caret-blink {
  0%, 45% { opacity: 1; }
  55%, 100% { opacity: 0; }
}

/* separator — the dash between cell groups */
[data-slot="input-otp"] > [data-slot="separator"] {
  display: inline-flex;
  align-items: center;
  margin-inline: var(--space-inline-md);
  color: var(--content-secondary);
}
[data-slot="input-otp"] > [data-slot="separator"] svg {
  width: var(--icon-size-inline);
  height: var(--icon-size-inline);
  stroke-width: var(--icon-stroke);
}

/* states (contract/states.md) — the cell under the caret takes
   field-border-active plus the focus ring */
[data-slot="input-otp"] [data-slot="cell"][data-active] {
  border-color: var(--field-border-active);
  outline: var(--focus-width) var(--focus-style)
    color-mix(in oklab, var(--focus) 60%, transparent);
  outline-offset: var(--focus-offset);
  z-index: var(--layer-sticky);
}
[data-slot="input-otp"][data-state="invalid"] [data-slot="cell"] {
  border-color: var(--status-critical);
}
[data-slot="input-otp"][data-state="invalid"] [data-slot="cell"][data-active] {
  outline-color: color-mix(in oklab, var(--status-critical) 60%, transparent);
}
[data-slot="input-otp"][data-state="readonly"] [data-slot="cell"] {
  background: var(--surface-sunken);
  color: var(--content-secondary);
}
[data-slot="input-otp"][data-disabled] {
  opacity: 0.5;
  pointer-events: none;
  cursor: var(--cursor-disabled);
}

@media (prefers-reduced-motion: reduce) {
  [data-slot="input-otp"] [data-slot="cell"] { transition: none; }
  [data-slot="input-otp"] [data-slot="caret"] { animation: none; }
}

/* Item recipe — contract slots only (contract/authoring.md step 3).
   Structure, prominence/size axes and states: contract/anatomy/item.json.
   Item is card's row-shaped sibling: the same content parts at control scale
   spacing and radius instead of container scale. */

[data-slot="item"] {
  display: flex;
  align-items: center;
  gap: var(--space-inline-lg);
  width: 100%;
  padding: var(--space-unit) var(--inset-control-x);
  border: var(--border-width) solid transparent;
  border-radius: var(--radius-control);
  background: transparent;
  color: var(--on-surface);
  font: var(--type-label);
  text-align: start;
  text-decoration: none;
  transition:
    background-color var(--duration-fast) var(--easing-standard),
    border-color var(--duration-fast) var(--easing-standard),
    color var(--duration-fast) var(--easing-standard);
}
[data-slot="item"][data-interactive] {
  cursor: var(--cursor-interactive);
}

/* size axis */
[data-slot="item"][data-size="sm"] {
  gap: var(--space-inline-md);
  padding: calc(var(--space-unit) * 0.5) calc(var(--inset-control-x) * 0.75);
}
[data-slot="item"][data-size="lg"] {
  gap: var(--space-inline-lg);
  padding: calc(var(--space-unit) * 2) calc(var(--inset-control-x) * 1.25);
}

/* prominence axis — shadcn default|outline|muted decomposes onto
   ghost|outline|solid (anatomyNotes) */
[data-slot="item"][data-prominence="ghost"] {
  background: transparent;
  border-color: transparent;
}
[data-slot="item"][data-prominence="outline"] {
  border-color: var(--border);
}
[data-slot="item"][data-prominence="solid"] {
  background: var(--surface-sunken);
  border-color: transparent;
}

/* media — top-aligns once a description is present */
[data-slot="item"] > [data-slot="media"] {
  display: inline-flex;
  flex-shrink: 0;
  align-items: center;
  justify-content: center;
  align-self: center;
  padding: var(--space-unit);
  border: var(--border-width) solid var(--border);
  border-radius: var(--radius-field-control);
  background: var(--surface-sunken);
  overflow: hidden;
}
[data-slot="item"]:has([data-slot="description"]) > [data-slot="media"] {
  align-self: flex-start;
}
[data-slot="item"] > [data-slot="media"] svg {
  width: var(--icon-size-control);
  height: var(--icon-size-control);
  stroke-width: var(--icon-stroke);
}

/* content — stacks title over description, takes the remaining inline space */
[data-slot="item"] > [data-slot="content"] {
  display: flex;
  flex: 1;
  flex-direction: column;
  gap: var(--space-stack-sm);
  min-width: 0;
}
[data-slot="item"] [data-slot="title"] {
  font: var(--type-label);
  color: var(--on-surface);
}
[data-slot="item"] [data-slot="description"] {
  font: var(--type-body);
  color: var(--content-secondary);
}

/* actions */
[data-slot="item"] > [data-slot="actions"] {
  display: flex;
  flex-shrink: 0;
  align-items: center;
  gap: var(--space-inline-md);
}

/* group + separator */
[data-slot="item"] [data-slot="group"] {
  display: flex;
  flex-direction: column;
  margin: 0;
  padding: 0;
  list-style: none;
}
[data-slot="item"] [data-slot="group"] > li {
  display: block;
}
[data-slot="separator"] {
  height: var(--border-width);
  margin-block: var(--space-stack-sm);
  background: var(--border-subtle);
  list-style: none;
}

/* states (contract/states.md) — hover/selected apply only when interactive */
[data-slot="item"][data-interactive]:hover {
  background: var(--interaction-hover);
}
[data-slot="item"][data-state="selected"] {
  background: var(--interaction-selected);
  color: var(--on-interaction-selected);
}
[data-slot="item"][data-state="selected"] [data-slot="title"] {
  color: var(--on-interaction-selected);
}
[data-slot="item"]:focus-visible {
  outline: var(--focus-width) var(--focus-style)
    color-mix(in oklab, var(--focus) 60%, transparent);
  outline-offset: var(--focus-offset);
}
[data-slot="item"][data-disabled] {
  opacity: 0.5;
  pointer-events: none;
  cursor: var(--cursor-disabled);
}

@media (prefers-reduced-motion: reduce) {
  [data-slot="item"] { transition: none; }
}

/* LIFTED from shadcn/kbd.tsx via scripts/lift.py — the dictionary run in reverse.
   Review against contract/anatomy/kbd.json + the button exemplar before accepting.
   Unmapped words: see kbd.lift-report.json */

[data-slot="kbd"] {
  pointer-events: none;
  display: inline-flex;
  width: fit-content;
  align-items: center;
  justify-content: center;
  gap: var(--space-inline-sm);
  border-radius: calc(var(--radius-knob) * 0.6);
  background: var(--surface-sunken);
  font: var(--type-caption);
  font-weight: var(--ui-weight);
  color: var(--content-secondary);
  user-select: none;
}

/* LIFTED from shadcn/label.tsx via scripts/lift.py — the dictionary run in reverse.
   Review against contract/anatomy/label.json + the button exemplar before accepting.
   Unmapped words: see label.lift-report.json */

[data-slot="label"] {
  display: flex;
  align-items: center;
  gap: var(--space-inline-md);
  font-size: var(--text-ui);
  line-height: 1;
  font-weight: var(--ui-weight);
  user-select: none;
}

/* Menubar recipe — contract slots only (contract/authoring.md step 3).
   Structure, states and motion: contract/anatomy/menubar.json.
   A row of dropdown menus sharing one roving tab stop; the panel/item/
   separator/group-label recipes are dropdown-menu's, unchanged.
   No size axis: a menubar is chrome, sized by the app shell. */

/* root — the bar itself */
[data-slot="menubar"] {
  display: flex;
  align-items: center;
  gap: var(--space-inline-sm);
  padding: var(--space-unit);
  background: var(--surface);
  border: var(--border-width) solid var(--border);
  border-radius: var(--radius-control);
  box-shadow: var(--elevation-resting);
}

[data-slot="menubar"] [data-slot="menubar-menu"] {
  position: relative;
}

/* trigger — state:open holds the interaction-selected recipe so the bar
   shows which menu is down */
[data-slot="menubar"] [data-slot="trigger"] {
  display: inline-flex;
  align-items: center;
  height: var(--control-height-sm);
  padding: 0 var(--inset-control-x);
  border: none;
  border-radius: var(--radius-control);
  background: transparent;
  color: var(--on-surface);
  font: var(--type-action);
  text-transform: var(--action-case);
  letter-spacing: var(--action-tracking);
  cursor: var(--cursor-interactive);
  user-select: none;
  outline: none;
  transition:
    background-color var(--duration-fast) var(--easing-standard),
    color var(--duration-fast) var(--easing-standard);
}
[data-slot="menubar"] [data-slot="trigger"]:hover {
  background: var(--interaction-hover);
}
[data-slot="menubar"] [data-slot="trigger"]:active {
  background: var(--interaction-active);
}
[data-slot="menubar"] [data-slot="trigger"][data-state="open"] {
  background: var(--interaction-selected);
  color: var(--on-interaction-selected);
}
[data-slot="menubar"] [data-slot="trigger"]:focus-visible {
  outline: var(--focus-width) solid color-mix(in oklab, var(--focus) 60%, transparent);
  outline-offset: var(--focus-offset);
}
[data-slot="menubar"] [data-slot="trigger"][data-disabled] {
  opacity: 0.5;
  pointer-events: none;
  cursor: var(--cursor-disabled);
}

/* panel */
[data-slot="menubar"] [data-slot="panel"] {
  position: absolute;
  inset-inline-start: 0;
  inset-block-start: calc(100% + var(--space-inline-sm));
  z-index: var(--layer-dropdown);
  min-width: var(--size-overlay-sm);
  padding: var(--space-unit);
  background: var(--surface-overlay);
  color: var(--on-surface-overlay);
  border: var(--border-width) solid var(--border);
  border-radius: var(--radius-overlay);
  box-shadow: var(--elevation-overlay);
  outline: none;
}
[data-slot="menubar"] [data-slot="panel"][data-state="open"] {
  animation: menubar-panel-enter var(--duration-fast) var(--easing-enter);
}
@keyframes menubar-panel-enter {
  from { opacity: 0; transform: translateY(calc(var(--space-unit) * -1)); }
  to { opacity: 1; transform: translateY(0); }
}

/* item */
[data-slot="menubar"] [data-slot="item"] {
  display: flex;
  align-items: center;
  gap: var(--space-inline-md);
  min-height: var(--control-height-sm);
  padding-inline: var(--space-inline-md);
  padding-block: var(--space-inline-sm);
  border-radius: var(--radius-control);
  font: var(--type-label);
  cursor: var(--cursor-interactive);
  user-select: none;
  outline: none;
  transition: background-color var(--duration-fast) var(--easing-standard);
}
[data-slot="menubar"] [data-slot="item"]:hover,
[data-slot="menubar"] [data-slot="item"]:focus {
  background: var(--interaction-hover);
}
[data-slot="menubar"] [data-slot="item"]:active {
  background: var(--interaction-active);
}
[data-slot="menubar"] [data-slot="item"]:focus-visible {
  outline: var(--focus-width) solid color-mix(in oklab, var(--focus) 60%, transparent);
  outline-offset: calc(var(--focus-offset) - var(--border-width));
}
[data-slot="menubar"] [data-slot="item"][data-disabled] {
  opacity: 0.5;
  pointer-events: none;
  cursor: var(--cursor-disabled);
}

/* item-icon */
[data-slot="menubar"] [data-slot="item-icon"] {
  display: inline-flex;
  flex-shrink: 0;
  color: var(--content-secondary);
}
[data-slot="menubar"] [data-slot="item-icon"] svg {
  width: var(--icon-size-inline);
  height: var(--icon-size-inline);
}

/* item-label */
[data-slot="menubar"] [data-slot="item-label"] {
  flex: 1;
  min-width: 0;
  font: var(--type-label);
}

/* item-shortcut */
[data-slot="menubar"] [data-slot="item-shortcut"] {
  flex-shrink: 0;
  margin-inline-start: auto;
  font: var(--type-data);
  color: var(--content-secondary);
}

/* separator */
[data-slot="menubar"] [data-slot="separator"] {
  height: var(--border-width);
  margin-block: var(--space-unit);
  margin-inline: calc(var(--space-unit) * -1);
  background: var(--border-subtle);
}

/* group-label */
[data-slot="menubar"] [data-slot="group-label"] {
  padding-inline: var(--space-inline-md);
  padding-block: var(--space-inline-sm);
  font: var(--type-caption);
  color: var(--content-secondary);
}

@media (prefers-reduced-motion: reduce) {
  [data-slot="menubar"] [data-slot="panel"][data-state="open"] { animation: none; }
  [data-slot="menubar"] [data-slot="trigger"],
  [data-slot="menubar"] [data-slot="item"] { transition: none; }
}

/* Native-select recipe — contract slots only (contract/authoring.md step 3).
   Structure, size axis and states: contract/anatomy/native-select.json.
   The root exists only because the native control cannot paint its own
   chevron; the control recipe matches input's root exactly. */

[data-slot="native-select"] {
  position: relative;
  display: inline-flex;
  align-items: center;
  width: 100%;
  min-width: 0;
  height: var(--control-height-md);
  border-radius: var(--radius-control);
}

/* size axis */
[data-slot="native-select"][data-size="sm"] { height: var(--control-height-sm); }
[data-slot="native-select"][data-size="lg"] { height: var(--control-height-lg); }

/* control */
[data-slot="native-select"] > [data-slot="control"] {
  appearance: none;
  width: 100%;
  height: 100%;
  min-width: 0;
  padding-inline: var(--inset-control-x)
    calc(var(--inset-control-x) + var(--icon-size-control));
  border: var(--border-width) solid var(--field-border);
  border-radius: var(--radius-control);
  background: var(--field-surface);
  color: var(--on-surface);
  font: var(--type-label);
  box-shadow: var(--elevation-resting);
  cursor: var(--cursor-interactive);
  outline: none;
  transition:
    border-color var(--duration-fast) var(--easing-standard),
    background-color var(--duration-fast) var(--easing-standard);
}

/* indicator — decorative chevron, pointer-inert; it does NOT rotate on open,
   because the platform popup is not a state this component can observe */
[data-slot="native-select"] > [data-slot="indicator"] {
  position: absolute;
  inset-inline-end: var(--inset-control-x);
  display: inline-flex;
  align-items: center;
  color: var(--content-secondary);
  pointer-events: none;
}
[data-slot="native-select"] > [data-slot="indicator"] svg {
  width: var(--icon-size-control);
  height: var(--icon-size-control);
  stroke-width: var(--icon-stroke);
}

/* option / group-label — the platform paints the popup */
[data-slot="native-select"] [data-slot="option"] {
  font: var(--type-label);
}
[data-slot="native-select"] [data-slot="group-label"] {
  font: var(--type-caption);
  color: var(--content-secondary);
}

/* states (contract/states.md) */
[data-slot="native-select"]:hover > [data-slot="control"] {
  border-color: var(--field-border-hover);
  background: var(--field-surface-hover);
}
[data-slot="native-select"] > [data-slot="control"]:focus-visible {
  border-color: var(--field-border-active);
  outline: var(--focus-width) var(--focus-style)
    color-mix(in oklab, var(--focus) 60%, transparent);
  outline-offset: var(--focus-offset);
}
[data-slot="native-select"][data-state="invalid"] > [data-slot="control"] {
  border-color: var(--status-critical);
}
[data-slot="native-select"][data-state="invalid"] > [data-slot="control"]:focus-visible {
  outline-color: color-mix(in oklab, var(--status-critical) 60%, transparent);
}
[data-slot="native-select"][data-state="readonly"] > [data-slot="control"] {
  background: var(--surface-sunken);
  color: var(--content-secondary);
  cursor: var(--cursor-disabled);
}
[data-slot="native-select"][data-state="readonly"]:hover > [data-slot="control"] {
  border-color: var(--field-border);
  background: var(--surface-sunken);
}
[data-slot="native-select"][data-disabled] {
  opacity: 0.5;
  cursor: var(--cursor-disabled);
}
[data-slot="native-select"][data-disabled] > [data-slot="control"] {
  pointer-events: none;
  cursor: var(--cursor-disabled);
}

@media (prefers-reduced-motion: reduce) {
  [data-slot="native-select"] > [data-slot="control"] { transition: none; }
}

/* Navigation menu recipe — contract slots only (contract/authoring.md step 3).
   Structure, states and motion: contract/anatomy/navigation-menu.json.
   Links stay links; the panel is a free content region, not a menu.
   Character: the theme. */

/* root — the nav landmark */
[data-slot="navigation-menu"] {
  display: flex;
  background: var(--surface);
  gap: var(--space-inline-sm);
}
[data-slot="navigation-menu"][data-orientation="vertical"] {
  flex-direction: column;
}

/* list */
[data-slot="navigation-menu"] [data-slot="list"] {
  display: flex;
  align-items: center;
  gap: var(--space-inline-sm);
  margin: 0;
  padding: 0;
  list-style: none;
}
[data-slot="navigation-menu"] [data-slot="list"][data-orientation="vertical"] {
  flex-direction: column;
  align-items: stretch;
}

/* item */
[data-slot="navigation-menu"] [data-slot="item"] {
  position: relative;
  border-radius: var(--radius-control);
}

/* trigger + link share the top-level chrome */
[data-slot="navigation-menu"] [data-slot="trigger"],
[data-slot="navigation-menu"] [data-slot="link"] {
  position: relative;
  display: inline-flex;
  align-items: center;
  gap: var(--space-inline-sm);
  height: var(--control-height-md);
  padding: 0 var(--inset-control-x);
  border: none;
  border-radius: var(--radius-control);
  background: transparent;
  color: var(--content-secondary);
  font: var(--type-action);
  text-transform: var(--action-case);
  letter-spacing: var(--action-tracking);
  text-decoration: none;
  cursor: var(--cursor-interactive);
  outline: none;
  transition:
    background-color var(--duration-fast) var(--easing-standard),
    color var(--duration-fast) var(--easing-standard);
}
[data-slot="navigation-menu"] [data-slot="trigger"]:hover,
[data-slot="navigation-menu"] [data-slot="link"]:hover {
  background: var(--interaction-hover);
  color: var(--on-interaction-selected);
}
[data-slot="navigation-menu"] [data-slot="trigger"]:focus-visible,
[data-slot="navigation-menu"] [data-slot="link"]:focus-visible {
  outline: var(--focus-width) solid color-mix(in oklab, var(--focus) 60%, transparent);
  outline-offset: var(--focus-offset);
}
[data-slot="navigation-menu"] [data-slot="trigger"][data-disabled],
[data-slot="navigation-menu"] [data-slot="link"][data-disabled] {
  opacity: 0.5;
  pointer-events: none;
  cursor: var(--cursor-disabled);
}
[data-slot="navigation-menu"] [data-slot="trigger"][data-state="open"] {
  background: var(--interaction-hover);
  color: var(--on-interaction-selected);
}

/* state:selected (aria-current=page) switches content-secondary
   to on-interaction-selected */
[data-slot="navigation-menu"] [data-slot="link"][data-state="selected"] {
  color: var(--on-interaction-selected);
}

/* trigger-icon — expand icon role, rotates 180deg on open */
[data-slot="navigation-menu"] [data-slot="trigger-icon"] {
  display: inline-flex;
  transition: transform var(--duration-fast) var(--easing-standard);
}
[data-slot="navigation-menu"] [data-slot="trigger-icon"] svg {
  width: var(--icon-size-inline);
  height: var(--icon-size-inline);
}
[data-slot="navigation-menu"] [data-slot="trigger"][data-state="open"] [data-slot="trigger-icon"] {
  transform: rotate(180deg);
}

/* selected-indicator — bottom edge when horizontal, inline-start edge when
   vertical; only paints for the current destination */
[data-slot="navigation-menu"] [data-slot="selected-indicator"] {
  position: absolute;
  background: var(--selected-indicator);
  opacity: 0;
  transition:
    opacity var(--duration-fast) var(--easing-standard),
    transform var(--duration-fast) var(--easing-standard);
}
[data-slot="navigation-menu"] [data-slot="selected-indicator"][data-orientation="horizontal"] {
  inset-inline: var(--inset-control-x);
  inset-block-end: 0;
  block-size: var(--border-width-strong);
}
[data-slot="navigation-menu"] [data-slot="selected-indicator"][data-orientation="vertical"] {
  inset-block: var(--space-inline-sm);
  inset-inline-start: 0;
  inline-size: var(--border-width-strong);
}
[data-slot="navigation-menu"] [data-state="selected"] [data-slot="selected-indicator"] {
  opacity: 1;
}

/* panel — a free content region hosting grouped links, descriptions, promos */
[data-slot="navigation-menu"] [data-slot="panel"] {
  position: absolute;
  inset-inline-start: 0;
  inset-block-start: calc(100% + var(--space-inline-sm));
  z-index: var(--layer-dropdown);
  display: flex;
  flex-direction: column;
  gap: var(--space-stack-sm);
  min-width: var(--size-overlay-sm);
  padding: var(--inset-container);
  background: var(--surface-overlay);
  color: var(--on-surface-overlay);
  border: var(--border-width) solid var(--border);
  border-radius: var(--radius-overlay);
  box-shadow: var(--elevation-overlay);
}
[data-slot="navigation-menu"] [data-slot="panel"][data-orientation="vertical"] {
  position: static;
  min-width: 0;
  box-shadow: none;
  border: none;
  padding-inline-start: var(--space-inline-lg);
}
[data-slot="navigation-menu"] [data-slot="panel"][data-state="open"] {
  animation: navigation-menu-panel-enter var(--duration-base) var(--easing-enter);
}
@keyframes navigation-menu-panel-enter {
  from { opacity: 0; transform: translateY(calc(var(--space-unit) * -1)); }
  to { opacity: 1; transform: translateY(0); }
}

/* links inside a panel stack and may carry a description */
[data-slot="navigation-menu"] [data-slot="panel"] [data-slot="link"] {
  height: auto;
  flex-direction: column;
  align-items: flex-start;
  gap: var(--space-unit);
  padding-block: var(--space-inline-sm);
}
[data-slot="navigation-menu"] [data-slot="link-description"] {
  font: var(--type-caption);
  color: var(--content-secondary);
}

@media (prefers-reduced-motion: reduce) {
  [data-slot="navigation-menu"] [data-slot="panel"][data-state="open"] { animation: none; }
  [data-slot="navigation-menu"] [data-slot="trigger"],
  [data-slot="navigation-menu"] [data-slot="link"],
  [data-slot="navigation-menu"] [data-slot="trigger-icon"],
  [data-slot="navigation-menu"] [data-slot="selected-indicator"] { transition: none; }
}

/* Pagination recipe — contract slots only (contract/authoring.md step 3).
   Structure and states: contract/anatomy/pagination.json. Character: the theme. */

[data-slot="pagination"] {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: var(--space-inline-sm);
}

/* list */
[data-slot="pagination"] [data-slot="list"] {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--space-inline-sm);
  margin: 0;
  padding: 0;
  list-style: none;
}

/* item — the list item carries no chrome of its own */
[data-slot="pagination"] [data-slot="item"] {
  display: inline-flex;
}

/* page / previous / next share the control box */
[data-slot="pagination"] [data-slot="page"],
[data-slot="pagination"] [data-slot="previous"],
[data-slot="pagination"] [data-slot="next"] {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--space-inline-sm);
  min-width: var(--control-height-md);
  height: var(--control-height-md);
  padding-inline: calc(var(--inset-control-x) * 0.5);
  border: var(--border-width) solid transparent;
  border-radius: var(--radius-control);
  background: transparent;
  font: var(--type-action);
  color: var(--on-surface);
  text-decoration: none;
  cursor: var(--cursor-interactive);
  outline: none;
  transition:
    background-color var(--duration-fast) var(--easing-standard),
    border-color var(--duration-fast) var(--easing-standard),
    color var(--duration-fast) var(--easing-standard);
}
[data-slot="pagination"] [data-slot="previous"],
[data-slot="pagination"] [data-slot="next"] {
  padding-inline: var(--inset-control-x);
}

[data-slot="pagination"] [data-slot="page"]:hover,
[data-slot="pagination"] [data-slot="previous"]:hover,
[data-slot="pagination"] [data-slot="next"]:hover {
  background: var(--interaction-hover);
}
[data-slot="pagination"] [data-slot="page"]:focus-visible,
[data-slot="pagination"] [data-slot="previous"]:focus-visible,
[data-slot="pagination"] [data-slot="next"]:focus-visible {
  outline: var(--focus-width) var(--focus-style) color-mix(in oklab, var(--focus) 60%, transparent);
  outline-offset: var(--focus-offset);
}

/* the current page — differs from hover by fill AND border, never weight alone */
[data-slot="pagination"] [data-slot="page"][data-state="selected"] {
  background: var(--interaction-selected);
  border-color: var(--selected-indicator);
  color: var(--on-interaction-selected);
}
[data-slot="pagination"] [data-slot="page"][data-state="selected"]:hover {
  background: var(--interaction-selected);
}

/* ends: the step stays in place and goes disabled rather than disappearing */
[data-slot="pagination"] [data-slot="previous"][data-disabled],
[data-slot="pagination"] [data-slot="next"][data-disabled] {
  opacity: 0.5;
  cursor: var(--cursor-disabled);
}
[data-slot="pagination"] [data-slot="previous"][data-disabled]:hover,
[data-slot="pagination"] [data-slot="next"][data-disabled]:hover {
  background: transparent;
}

[data-slot="pagination"] [data-slot="previous"] svg,
[data-slot="pagination"] [data-slot="next"] svg,
[data-slot="pagination"] [data-slot="ellipsis"] svg {
  width: var(--icon-size-control);
  height: var(--icon-size-control);
}

/* ellipsis — decorative glyph plus the visually-hidden "More pages" label */
[data-slot="pagination"] [data-slot="ellipsis"] {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: var(--control-height-md);
  height: var(--control-height-md);
  color: var(--content-secondary);
}
[data-slot="pagination"] [data-slot="visually-hidden"] {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip-path: inset(50%);
  white-space: nowrap;
  border: 0;
}

/* count-label — the compact form's "Page 3 of 20" */
[data-slot="pagination"] [data-slot="count-label"] {
  font: var(--type-caption);
  color: var(--content-secondary);
}

/* size axis */
[data-slot="pagination"][data-size="sm"] [data-slot="page"],
[data-slot="pagination"][data-size="sm"] [data-slot="previous"],
[data-slot="pagination"][data-size="sm"] [data-slot="next"],
[data-slot="pagination"][data-size="sm"] [data-slot="ellipsis"] {
  min-width: var(--control-height-sm);
  height: var(--control-height-sm);
}
[data-slot="pagination"][data-size="lg"] [data-slot="page"],
[data-slot="pagination"][data-size="lg"] [data-slot="previous"],
[data-slot="pagination"][data-size="lg"] [data-slot="next"],
[data-slot="pagination"][data-size="lg"] [data-slot="ellipsis"] {
  min-width: var(--control-height-lg);
  height: var(--control-height-lg);
}

@media (prefers-reduced-motion: reduce) {
  [data-slot="pagination"] [data-slot="page"],
  [data-slot="pagination"] [data-slot="previous"],
  [data-slot="pagination"] [data-slot="next"] {
    transition: none;
  }
}

/* Popover recipe — contract slots only (contract/authoring.md step 3).
   Structure and states: contract/anatomy/popover.json. Character: the theme. */

[data-slot="popover"] {
  position: relative;
  display: inline-flex;
}

/* trigger — typically a button; the button anatomy owns its own chrome, so
   the popover only contributes the focus recipe and the action type */
[data-slot="popover"] > [data-slot="trigger"] {
  font: var(--type-action);
  cursor: var(--cursor-interactive);
}
[data-slot="popover"] > [data-slot="trigger"]:focus-visible {
  outline: var(--focus-width) var(--focus-style) color-mix(in oklab, var(--focus) 60%, transparent);
  outline-offset: var(--focus-offset);
}

/* panel — overlay chrome on the dropdown layer */
[data-slot="popover"] [data-slot="panel"] {
  position: absolute;
  z-index: var(--layer-dropdown);
  width: max-content;
  max-width: var(--size-overlay-sm);
  padding: var(--inset-container);
  border: var(--border-width) solid var(--border);
  border-radius: var(--radius-overlay);
  background: var(--surface-overlay);
  color: var(--on-surface-overlay);
  box-shadow: var(--elevation-overlay);
  outline: none;
}

/* placement — logical sides survive RTL */
[data-slot="popover"] [data-slot="panel"][data-side="bottom"] {
  top: 100%;
  inset-inline-start: 0;
  margin-block-start: var(--space-stack-sm);
}
[data-slot="popover"] [data-slot="panel"][data-side="top"] {
  bottom: 100%;
  inset-inline-start: 0;
  margin-block-end: var(--space-stack-sm);
}
[data-slot="popover"] [data-slot="panel"][data-side="start"] {
  top: 0;
  inset-inline-end: 100%;
  margin-inline-end: var(--space-inline-sm);
}
[data-slot="popover"] [data-slot="panel"][data-side="end"] {
  top: 0;
  inset-inline-start: 100%;
  margin-inline-start: var(--space-inline-sm);
}

/* motion — enter duration-fast/easing-enter (anatomy motion block) */
[data-slot="popover"] [data-slot="panel"][data-state="open"] {
  animation: popover-panel-enter var(--duration-fast) var(--easing-enter);
}
@keyframes popover-panel-enter {
  from { opacity: 0; transform: scale(0.98); }
  to { opacity: 1; transform: scale(1); }
}

@media (prefers-reduced-motion: reduce) {
  [data-slot="popover"] [data-slot="panel"][data-state="open"] { animation: none; }
}

/* Progress recipe — contract slots only (contract/authoring.md step 3).
   LIFTED from shadcn/progress.tsx via scripts/lift.py, then reviewed against
   contract/anatomy/progress.json + the button exemplar.
   Unmapped words: see progress.lift-report.json */

/* root — the track; clips the indicator */
[data-slot="progress"] {
  position: relative;
  display: block;
  inline-size: 100%;
  block-size: calc(var(--space-unit) * 2);
  overflow: hidden;
  background: var(--surface-sunken);
  border-radius: var(--radius-pill);
}

/* indicator — determinate: inline-size bound to the value fraction */
[data-slot="progress"] [data-slot="indicator"] {
  block-size: 100%;
  inline-size: 0%;
  background: var(--action);
  border-radius: var(--radius-pill);
  transition: inline-size var(--duration-base) var(--easing-standard);
}

/* states (contract/states.md) — indeterminate: a fixed-length segment
   sweeping the track in a loop (anatomy statesNote) */
[data-slot="progress"][data-state="indeterminate"] [data-slot="indicator"] {
  inline-size: 33%;
  transition: none;
  animation: progress-sweep var(--duration-slow) var(--easing-standard) infinite;
}

@keyframes progress-sweep {
  from { transform: translateX(-100%); }
  to { transform: translateX(300%); }
}

@media (prefers-reduced-motion: reduce) {
  [data-slot="progress"] [data-slot="indicator"] { transition: none; }
  [data-slot="progress"][data-state="indeterminate"] [data-slot="indicator"] {
    /* no sweep: hold a static half-track so the busy state stays legible */
    animation: none;
    inline-size: 50%;
  }
}

/* Radio group recipe — contract slots only. Anatomy: contract/anatomy/radio-group.json */

[data-slot="radio-group"] { display: flex; gap: var(--space-stack-sm); }
[data-slot="radio-group"][data-orientation="vertical"] { flex-direction: column; }
[data-slot="radio-group"][data-orientation="horizontal"] { flex-direction: row; gap: var(--space-inline-lg); }
[data-slot="radio-group"] [data-slot="item"] {
[data-slot="radio-group"] [data-slot="control"] {
  display: inline-grid;
  place-items: center;
  flex-shrink: 0;
  width: var(--icon-size-control);
  height: var(--icon-size-control);
  padding: 0;
  background: var(--field-surface);
  border: var(--border-width) solid var(--field-border);
  border-radius: var(--radius-pill);
  cursor: var(--cursor-interactive);
  transition: border-color var(--duration-fast) var(--easing-standard);
}
[data-slot="radio-group"] [data-slot="control"]:hover { border-color: var(--field-border-hover); }
[data-slot="radio-group"] [data-slot="control"][data-state="selected"] { border-color: var(--action); }
[data-slot="radio-group"] [data-slot="control"]:focus-visible {
  outline: var(--focus-width) solid color-mix(in oklab, var(--focus) 50%, transparent);
  outline-offset: var(--focus-offset);
}
[data-slot="radio-group"][aria-invalid="true"] [data-slot="control"] { border-color: var(--status-critical); }
[data-slot="radio-group"] [data-slot="indicator"] {
  width: calc(var(--icon-size-inline) * 0.7);
  height: calc(var(--icon-size-inline) * 0.7);
  border-radius: var(--radius-pill);
  background: transparent;
  transition: background-color var(--duration-fast) var(--easing-standard);
}
[data-slot="radio-group"] [data-slot="control"][data-state="selected"] [data-slot="indicator"] {
[data-slot="radio-group"] [data-slot="item"][data-disabled], [data-slot="radio-group"] [data-slot="radio-group"][data-disabled] {
  opacity: 0.5; pointer-events: none; cursor: var(--cursor-disabled);
}
[data-slot="radio-group"] [data-slot="item"] [data-slot="label"] {
@media (prefers-reduced-motion: reduce) {
  [data-slot="radio-group"] [data-slot="control"], [data-slot="indicator"] { transition: none; }
}

/* Resizable recipe — contract slots only. Anatomy: contract/anatomy/resizable.json */

[data-slot="resizable"] {
  display: flex;
  inline-size: 100%;
  border: var(--border-width) solid var(--border);
  border-radius: var(--radius-container);
  overflow: hidden;
}
[data-slot="resizable"][data-orientation="vertical"] { flex-direction: column; }
[data-slot="resizable"] > [data-slot="panel"] {
  flex: 1;
  min-inline-size: 0;
  min-block-size: 0;
  overflow: auto;
  background: var(--surface-raised);
  color: var(--on-surface-raised);
}
[data-slot="resizable"] > [data-slot="handle"] {
  position: relative;
  flex: none;
  inline-size: var(--border-width);
  background: var(--border);
  cursor: var(--cursor-grab);
  touch-action: none;
}
[data-slot="resizable"][data-orientation="vertical"] > [data-slot="handle"] {
  inline-size: auto;
  block-size: var(--border-width);
}
[data-slot="resizable"] > [data-slot="handle"]:hover { background: var(--field-border-hover); }
[data-slot="resizable"] > [data-slot="handle"]:focus-visible {
  outline: var(--focus-width) solid color-mix(in oklab, var(--focus) 50%, transparent);
  outline-offset: var(--focus-offset);
  z-index: var(--layer-sticky);
}
[data-slot="resizable"] [data-slot="grip"] {
  position: absolute;
  inset-block-start: 50%;
  inset-inline-start: 50%;
  inline-size: calc(var(--space-unit) * 3);
  block-size: calc(var(--space-unit) * 6);
  transform: translate(-50%, -50%);
  background: var(--surface-sunken);
  border: var(--border-width) solid var(--border);
  border-radius: var(--radius-field-control);
}
[data-slot="resizable"][data-orientation="vertical"] [data-slot="grip"] {
  inline-size: calc(var(--space-unit) * 6);
  block-size: calc(var(--space-unit) * 3);
}
[data-slot="resizable"] > [data-slot="handle"][data-disabled] {
  pointer-events: none;
  cursor: var(--cursor-disabled);
}

/* Scroll-area recipe — contract slots only (contract/authoring.md step 3).
   Structure, orientation axis and states: contract/anatomy/scroll-area.json.
   Overlay (fade-in) scrollbars are RECIPE, not anatomy — a theme that keeps
   the native ones renders root + viewport alone and loses no behavior. */

[data-slot="scroll-area"] {
  position: relative;
  border-radius: var(--radius-container);
}

/* viewport — the actual scroll container and the only focusable part */
[data-slot="scroll-area"] > [data-slot="viewport"] {
  width: 100%;
  height: 100%;
  overflow: auto;
  border-radius: var(--radius-container);
  scrollbar-width: none;
  outline: none;
}
[data-slot="scroll-area"] > [data-slot="viewport"]::-webkit-scrollbar {
  display: none;
}
[data-slot="scroll-area"] > [data-slot="viewport"]:focus-visible {
  outline: var(--focus-width) var(--focus-style)
    color-mix(in oklab, var(--focus) 60%, transparent);
  outline-offset: var(--focus-offset);
}

/* scrollbar — one per scrollable axis, overlaid on the viewport */
[data-slot="scroll-area"] > [data-slot="scrollbar"] {
  position: absolute;
  display: flex;
  background: var(--surface-sunken);
  opacity: 0;
  transition: opacity var(--duration-fast) var(--easing-standard);
}
[data-slot="scrollbar"][data-orientation="vertical"] {
  inset-block: 0;
  inset-inline-end: 0;
  width: calc(var(--space-unit) * 1.5);
  border-inline-start: var(--border-width) solid var(--border-subtle);
}
[data-slot="scrollbar"][data-orientation="horizontal"] {
  inset-inline: 0;
  inset-block-end: 0;
  height: calc(var(--space-unit) * 1.5);
  border-block-start: var(--border-width) solid var(--border-subtle);
}
[data-slot="scroll-area"]:hover > [data-slot="scrollbar"],
[data-slot="scroll-area"]:focus-within > [data-slot="scrollbar"],
[data-slot="scroll-area"] > [data-slot="scrollbar"]:has([data-state="dragging"]) {
  opacity: 1;
}

/* thumb */
[data-slot="scroll-area"] [data-slot="thumb"] {
  position: absolute;
  background: var(--border-strong);
  border-radius: var(--radius-pill);
  cursor: var(--cursor-grab);
  transition: background-color var(--duration-fast) var(--easing-standard);
}
[data-slot="scrollbar"][data-orientation="vertical"] [data-slot="thumb"] {
  inset-inline: 0;
  min-height: var(--target-min);
}
[data-slot="scrollbar"][data-orientation="horizontal"] [data-slot="thumb"] {
  inset-block: 0;
  min-width: var(--target-min);
}

/* corner — the square where two scrollbars meet */
[data-slot="scroll-area"] > [data-slot="corner"] {
  position: absolute;
  inset-block-end: 0;
  inset-inline-end: 0;
  width: calc(var(--space-unit) * 1.5);
  height: calc(var(--space-unit) * 1.5);
  background: var(--surface-sunken);
}

/* states (contract/states.md) */
[data-slot="scroll-area"] [data-slot="thumb"]:hover {
  background: var(--interaction-hover);
}
[data-slot="scroll-area"] [data-slot="thumb"][data-state="dragging"] {
  background: var(--on-surface);
}

@media (prefers-reduced-motion: reduce) {
  [data-slot="scroll-area"] > [data-slot="scrollbar"],
  [data-slot="scroll-area"] [data-slot="thumb"] { transition: none; }
}

/* Select recipe — contract slots only (contract/authoring.md step 3).
   LIFTED from shadcn/select.tsx via scripts/lift.py, then reviewed against
   contract/anatomy/select.json + the button exemplar.
   Unmapped words: see select.lift-report.json */

[data-slot="select"] {
  position: relative;
  display: inline-flex;
  width: fit-content;
}

/* trigger (anatomy root recipe: field-border, surface, on-surface,
   radius-control, control-height-md, inset-control-x, type-label, focus) */
[data-slot="select"] [data-slot="trigger"] {
  display: inline-flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-inline-md);
  height: var(--control-height-md);
  width: fit-content;
  padding-inline: calc(var(--space-unit) * 3);
  border: var(--border-width) solid var(--field-border);
  border-radius: var(--radius-control);
  background: var(--surface);
  color: var(--on-surface);
  font: var(--type-label);
  white-space: nowrap;
  cursor: var(--cursor-interactive);
  box-shadow: var(--elevation-resting);
  outline: none;
  transition:
    color var(--duration-fast) var(--easing-standard),
    border-color var(--duration-fast) var(--easing-standard),
    box-shadow var(--duration-fast) var(--easing-standard);
}

/* size axis */
[data-slot="select"][data-size="sm"] [data-slot="trigger"] { height: var(--control-height-sm); }
[data-slot="select"][data-size="lg"] [data-slot="trigger"] { height: var(--control-height-lg); }

/* value (content slot; placeholder shows content-secondary) */
[data-slot="select"] [data-slot="value"] {
  overflow: hidden;
  text-overflow: ellipsis;
}
[data-slot="select"] [data-slot="value"][data-placeholder] {
  color: var(--content-secondary);
}

/* indicator — expand icon role; rotates 180deg on open at duration-fast */
[data-slot="select"] [data-slot="indicator"] {
  display: inline-flex;
  flex-shrink: 0;
  color: var(--content-secondary);
  transition: transform var(--duration-fast) var(--easing-standard);
}
[data-slot="select"] [data-slot="indicator"] svg {
  width: var(--icon-size-control);
  height: var(--icon-size-control);
}
[data-slot="select"][data-state="open"] [data-slot="indicator"] {
  transform: rotate(180deg);
}

/* listbox */
[data-slot="select"] [data-slot="listbox"] {
  position: absolute;
  top: calc(100% + var(--space-unit));
  left: 0;
  z-index: var(--layer-dropdown);
  min-width: 100%;
  max-height: calc(var(--space-unit) * 64);
  overflow-y: auto;
  margin: 0;
  padding: var(--space-unit);
  list-style: none;
  background: var(--surface-overlay);
  color: var(--on-surface-overlay);
  border: var(--border-width) solid var(--border);
  border-radius: var(--radius-overlay);
  box-shadow: var(--elevation-overlay);
  animation: select-listbox-enter var(--duration-fast) var(--easing-enter);
}
@keyframes select-listbox-enter {
  from { opacity: 0; transform: translateY(calc(var(--space-unit) * -1)); }
  to { opacity: 1; transform: translateY(0); }
}

/* option */
[data-slot="select"] [data-slot="option"] {
  display: flex;
  align-items: center;
  gap: var(--space-inline-md);
  padding-inline: calc(var(--space-unit) * 2);
  padding-block: calc(var(--space-unit) * 1.5);
  border-radius: var(--radius-control);
  font: var(--type-label);
  white-space: nowrap;
  cursor: var(--cursor-interactive);
  user-select: none;
}
[data-slot="select"] [data-slot="option"][data-active] {
  background: var(--interaction-hover);
}
[data-slot="select"] [data-slot="option"][data-state="selected"] {
  background: var(--interaction-selected);
  color: var(--on-interaction-selected);
}
[data-slot="select"] [data-slot="option"][data-disabled] {
  opacity: 0.5;
  pointer-events: none;
  cursor: var(--cursor-disabled);
}

/* option-indicator — success icon role (checkmark on selected option) */
[data-slot="select"] [data-slot="option-indicator"] {
  display: inline-flex;
  margin-inline-start: auto;
}
[data-slot="select"] [data-slot="option-indicator"] svg {
  width: var(--icon-size-inline);
  height: var(--icon-size-inline);
}

/* states (contract/states.md) */
[data-slot="select"] [data-slot="trigger"]:hover {
  border-color: var(--field-border-hover);
  background: var(--field-surface-hover);
}
[data-slot="select"] [data-slot="trigger"]:focus-visible {
  border-color: var(--field-border-active);
  outline: var(--focus-width) solid color-mix(in oklab, var(--focus) 50%, transparent);
  outline-offset: var(--focus-offset);
}
[data-slot="select"] [data-slot="trigger"][aria-invalid="true"] {
  border-color: var(--status-critical);
}
[data-slot="select"] [data-slot="trigger"][aria-invalid="true"]:focus-visible {
  outline: var(--focus-width) solid color-mix(in oklab, var(--status-critical) 20%, transparent);
}
[data-slot="select"] [data-slot="trigger"][data-disabled],
[data-slot="select"] [data-slot="trigger"]:disabled {
  opacity: 0.5;
  pointer-events: none;
  cursor: var(--cursor-disabled);
}

@media (prefers-reduced-motion: reduce) {
  [data-slot="select"] [data-slot="trigger"],
  [data-slot="select"] [data-slot="indicator"] { transition: none; }
  [data-slot="select"] [data-slot="listbox"] { animation: none; }
}

/* Separator recipe — contract slots only (contract/authoring.md step 3).
   Structure and axes: contract/anatomy/separator.json. Character: the theme.
   Prominence rebinds the color only (anatomy note): subtle → border-subtle,
   default → border, strong → border-strong (3-tier scale, semantic.md §1).
   Lifted from shadcn/separator.tsx via scripts/lift.py, then reviewed against
   the anatomy + button exemplar. Unmapped words: separator.lift-report.json */

[data-slot="separator"] {
  flex-shrink: 0;
  background: var(--border);
}

/* orientation axis */
[data-slot="separator"][data-orientation="horizontal"] {
  height: var(--border-width);
  width: 100%;
}
[data-slot="separator"][data-orientation="vertical"] {
  width: var(--border-width);
  height: 100%;
}

/* prominence axis (default carries the base --border binding above) */
[data-slot="separator"][data-prominence="subtle"] {
  background: var(--border-subtle);
}
[data-slot="separator"][data-prominence="strong"] {
  background: var(--border-strong);
}

/* Sheet recipe — contract slots only (contract/authoring.md step 3).
   Structure, states and motion: contract/anatomy/sheet.json.
   The edge-anchored modal dialog: drawer minus the drag handle and the
   dragging state. Character: the theme. */

/* scrim */
[data-slot="sheet"] [data-slot="scrim"] {
  position: fixed;
  inset: 0;
  z-index: var(--layer-modal);
  background: var(--overlay-scrim);
}
[data-slot="sheet"] [data-slot="scrim"][data-state="open"] {
  animation: sheet-scrim-fade var(--duration-base) var(--easing-standard);
}
@keyframes sheet-scrim-fade {
  from { opacity: 0; }
  to { opacity: 1; }
}

/* panel — anchored to one logical edge; size binds to size-overlay-* along
   the dimension NORMAL to that edge, never to control-height-* */
[data-slot="sheet"] [data-slot="panel"] {
  position: fixed;
  z-index: var(--layer-modal);
  display: flex;
  flex-direction: column;
  gap: var(--space-stack-md);
  overflow-y: auto;
  padding: var(--inset-container);
  background: var(--surface-overlay);
  color: var(--on-surface-overlay);
  border: var(--border-width) solid var(--border);
  box-shadow: var(--elevation-modal);
  outline: none;
}

/* edge axis — position, extent, and the per-corner radius rule
   (semantic.md §4): only the corners OPPOSITE the anchored edge round */
[data-slot="sheet"] [data-slot="panel"][data-edge="start"] {
  inset-block: 0;
  inset-inline-start: 0;
  width: var(--size-overlay-md);
  max-width: 100%;
  border-start-end-radius: var(--radius-overlay);
  border-end-end-radius: var(--radius-overlay);
}
[data-slot="sheet"] [data-slot="panel"][data-edge="end"] {
  inset-block: 0;
  inset-inline-end: 0;
  width: var(--size-overlay-md);
  max-width: 100%;
  border-start-start-radius: var(--radius-overlay);
  border-end-start-radius: var(--radius-overlay);
}
[data-slot="sheet"] [data-slot="panel"][data-edge="top"] {
  inset-inline: 0;
  inset-block-start: 0;
  max-block-size: var(--size-overlay-md);
  border-end-start-radius: var(--radius-overlay);
  border-end-end-radius: var(--radius-overlay);
}
[data-slot="sheet"] [data-slot="panel"][data-edge="bottom"] {
  inset-inline: 0;
  inset-block-end: 0;
  max-block-size: var(--size-overlay-md);
  border-start-start-radius: var(--radius-overlay);
  border-start-end-radius: var(--radius-overlay);
}

/* size axis — the ramp applies to the dimension normal to the edge */
[data-slot="sheet"] [data-slot="panel"][data-size="sm"][data-edge="start"],
[data-slot="sheet"] [data-slot="panel"][data-size="sm"][data-edge="end"] { width: var(--size-overlay-sm); }
[data-slot="sheet"] [data-slot="panel"][data-size="lg"][data-edge="start"],
[data-slot="sheet"] [data-slot="panel"][data-size="lg"][data-edge="end"] { width: var(--size-overlay-lg); }
[data-slot="sheet"] [data-slot="panel"][data-size="sm"][data-edge="top"],
[data-slot="sheet"] [data-slot="panel"][data-size="sm"][data-edge="bottom"] { max-block-size: var(--size-overlay-sm); }
[data-slot="sheet"] [data-slot="panel"][data-size="lg"][data-edge="top"],
[data-slot="sheet"] [data-slot="panel"][data-size="lg"][data-edge="bottom"] { max-block-size: var(--size-overlay-lg); }

/* panel-enter — slides in from its own edge */
[data-slot="sheet"] [data-slot="panel"][data-state="open"][data-edge="start"] {
  animation: sheet-panel-enter-start var(--duration-base) var(--easing-enter);
}
[data-slot="sheet"] [data-slot="panel"][data-state="open"][data-edge="end"] {
  animation: sheet-panel-enter-end var(--duration-base) var(--easing-enter);
}
[data-slot="sheet"] [data-slot="panel"][data-state="open"][data-edge="top"] {
  animation: sheet-panel-enter-top var(--duration-base) var(--easing-enter);
}
[data-slot="sheet"] [data-slot="panel"][data-state="open"][data-edge="bottom"] {
  animation: sheet-panel-enter-bottom var(--duration-base) var(--easing-enter);
}
@keyframes sheet-panel-enter-start {
  from { transform: translateX(-100%); }
  to { transform: translateX(0); }
}
@keyframes sheet-panel-enter-end {
  from { transform: translateX(100%); }
  to { transform: translateX(0); }
}
@keyframes sheet-panel-enter-top {
  from { transform: translateY(-100%); }
  to { transform: translateY(0); }
}
@keyframes sheet-panel-enter-bottom {
  from { transform: translateY(100%); }
  to { transform: translateY(0); }
}

/* header */
[data-slot="sheet"] [data-slot="header"] {
  display: flex;
  flex-direction: column;
  gap: var(--space-stack-sm);
}

/* title */
[data-slot="sheet"] [data-slot="title"] {
  margin: 0;
  font: var(--type-heading-3);
  color: var(--on-surface-overlay);
}

/* description */
[data-slot="sheet"] [data-slot="description"] {
  margin: 0;
  font: var(--type-body);
  color: var(--content-secondary);
}

/* content — the scrolling body */
[data-slot="sheet"] [data-slot="content"] {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  font: var(--type-body);
}

/* footer — action slot */
[data-slot="sheet"] [data-slot="footer"] {
  display: flex;
  justify-content: flex-end;
  gap: var(--space-inline-md);
}
@media (max-width: 480px) {
  [data-slot="sheet"] [data-slot="footer"] {
    flex-direction: column-reverse;
  }
}

/* close — close icon role */
[data-slot="sheet"] [data-slot="close"] {
  position: absolute;
  top: calc(var(--space-unit) * 4);
  inset-inline-end: calc(var(--space-unit) * 4);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: var(--space-unit);
  border: none;
  border-radius: var(--radius-control);
  background: transparent;
  color: var(--content-secondary);
  cursor: var(--cursor-interactive);
  outline: none;
  transition:
    background-color var(--duration-fast) var(--easing-standard),
    color var(--duration-fast) var(--easing-standard);
}
[data-slot="sheet"] [data-slot="close"]:hover {
  background: var(--interaction-hover);
  color: var(--on-surface-overlay);
}
[data-slot="sheet"] [data-slot="close"]:focus-visible {
  outline: var(--focus-width) solid color-mix(in oklab, var(--focus) 60%, transparent);
  outline-offset: var(--focus-offset);
}
[data-slot="sheet"] [data-slot="close"] svg {
  width: var(--icon-size-control);
  height: var(--icon-size-control);
}

@media (prefers-reduced-motion: reduce) {
  [data-slot="sheet"] [data-slot="scrim"][data-state="open"],
  [data-slot="sheet"] [data-slot="panel"][data-state="open"] { animation: none; }
  [data-slot="sheet"] [data-slot="close"] { transition: none; }
}

/* Sidebar recipe — contract slots only (contract/authoring.md step 3).
   Structure, states and motion: contract/anatomy/sidebar.json.
   COLLAPSED is the disclosure state of the region (data-collapsed on root),
   orthogonal to the item states. Character: the theme. */

/* root — the nav landmark and its collapse animation */
[data-slot="sidebar"] {
  display: flex;
  flex-direction: column;
  gap: var(--space-stack-sm);
  z-index: var(--layer-sticky);
  inline-size: var(--size-overlay-sm);
  max-inline-size: 100%;
  block-size: 100%;
  overflow: hidden;
  background: var(--surface-raised);
  color: var(--on-surface-raised);
  transition: inline-size var(--duration-base) var(--easing-emphasized);
}

/* edge axis — the border sits on the side facing the content */
[data-slot="sidebar"][data-edge="inline-start"] {
  border-inline-end: var(--border-width) solid var(--border);
}
[data-slot="sidebar"][data-edge="inline-end"] {
  border-inline-start: var(--border-width) solid var(--border);
}

/* the collapsed rail: icons only, label and badge withdrawn */
[data-slot="sidebar"][data-collapsed] {
  inline-size: calc(var(--control-height-md) + var(--space-inline-lg));
}
[data-slot="sidebar"][data-collapsed] [data-slot="menu-label"],
[data-slot="sidebar"][data-collapsed] [data-slot="menu-badge"],
[data-slot="sidebar"][data-collapsed] [data-slot="group-label"] {
  display: none;
}
[data-slot="sidebar"][data-collapsed] [data-slot="menu-button"] {
  justify-content: center;
  padding-inline: 0;
}

/* trigger — the expand/collapse toggle */
[data-slot="sidebar"] [data-slot="trigger"] {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  inline-size: var(--control-height-md);
  block-size: var(--control-height-md);
  border: none;
  border-radius: var(--radius-control);
  background: transparent;
  color: var(--content-secondary);
  cursor: var(--cursor-interactive);
  outline: none;
  transition:
    background-color var(--duration-fast) var(--easing-standard),
    color var(--duration-fast) var(--easing-standard);
}
[data-slot="sidebar"] [data-slot="trigger"]:hover {
  background: var(--interaction-hover);
  color: var(--on-surface-raised);
}
[data-slot="sidebar"] [data-slot="trigger"]:focus-visible {
  outline: var(--focus-width) solid color-mix(in oklab, var(--focus) 60%, transparent);
  outline-offset: var(--focus-offset);
}
[data-slot="sidebar"] [data-slot="trigger"] svg {
  inline-size: var(--icon-size-control);
  block-size: var(--icon-size-control);
}

/* header */
[data-slot="sidebar"] [data-slot="header"] {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-inline-md);
  padding: var(--inset-container);
  padding-block-end: var(--space-stack-sm);
  border-block-end: var(--border-width) solid var(--border-subtle);
}

/* content — the scrolling body holding the groups */
[data-slot="sidebar"] [data-slot="content"] {
  display: flex;
  flex-direction: column;
  gap: var(--space-stack-md);
  flex: 1;
  min-block-size: 0;
  overflow-y: auto;
  padding-inline: var(--space-inline-md);
}

/* group */
[data-slot="sidebar"] [data-slot="group"] {
  display: flex;
  flex-direction: column;
  gap: var(--space-stack-sm);
}

/* group-label */
[data-slot="sidebar"] [data-slot="group-label"] {
  display: flex;
  align-items: center;
  block-size: var(--control-height-sm);
  padding-inline: var(--inset-control-x);
  font: var(--type-caption);
  color: var(--content-secondary);
}

/* menu — the list of items */
[data-slot="sidebar"] [data-slot="menu"] {
  display: flex;
  flex-direction: column;
  gap: var(--space-inline-sm);
  margin: 0;
  padding: 0;
  list-style: none;
}

/* menu-item — chrome lives on menu-button */
[data-slot="sidebar"] [data-slot="menu-item"] {
  position: relative;
}

/* menu-button */
[data-slot="sidebar"] [data-slot="menu-button"] {
  position: relative;
  display: flex;
  align-items: center;
  gap: var(--space-inline-md);
  inline-size: 100%;
  block-size: var(--control-height-md);
  padding-inline: var(--inset-control-x);
  border: none;
  border-radius: var(--radius-control);
  background: transparent;
  color: inherit;
  font: var(--type-label);
  text-align: start;
  text-decoration: none;
  cursor: var(--cursor-interactive);
  outline: none;
  transition:
    background-color var(--duration-fast) var(--easing-standard),
    color var(--duration-fast) var(--easing-standard);
}
[data-slot="sidebar"] [data-slot="menu-button"]:hover {
  background: var(--interaction-hover);
}
[data-slot="sidebar"] [data-slot="menu-button"]:focus-visible {
  outline: var(--focus-width) solid color-mix(in oklab, var(--focus) 60%, transparent);
  outline-offset: var(--focus-offset);
}
[data-slot="sidebar"] [data-slot="menu-button"][data-disabled] {
  opacity: 0.5;
  pointer-events: none;
  cursor: var(--cursor-disabled);
}

/* the current item takes interaction-selected PLUS selected-indicator — the
   indicator is what survives the collapsed rail, where the label is hidden */
[data-slot="sidebar"] [data-slot="menu-button"][data-state="selected"] {
  background: var(--interaction-selected);
  color: var(--on-interaction-selected);
}
[data-slot="sidebar"] [data-slot="menu-button"][data-state="selected"]::before {
  content: "";
  position: absolute;
  inset-block: var(--space-inline-sm);
  inset-inline-start: 0;
  inline-size: var(--border-width-strong);
  border-radius: var(--radius-pill);
  background: var(--selected-indicator);
}

/* menu-icon — the only visible content in the collapsed rail */
[data-slot="sidebar"] [data-slot="menu-icon"] {
  display: inline-flex;
  flex-shrink: 0;
  color: var(--content-secondary);
}
[data-slot="sidebar"] [data-slot="menu-icon"] svg {
  inline-size: var(--icon-size-control);
  block-size: var(--icon-size-control);
}
[data-slot="sidebar"] [data-slot="menu-button"][data-state="selected"] [data-slot="menu-icon"] {
  color: var(--on-interaction-selected);
}

/* menu-label */
[data-slot="sidebar"] [data-slot="menu-label"] {
  flex: 1;
  min-inline-size: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font: var(--type-label);
}

/* menu-badge */
[data-slot="sidebar"] [data-slot="menu-badge"] {
  flex-shrink: 0;
  padding-inline: var(--space-inline-md);
  border-radius: var(--radius-pill);
  background: var(--surface-sunken);
  font: var(--type-caption);
  color: var(--content-secondary);
}

/* submenu — one space-inline-md indent per depth: rhythm, never a raw value */
[data-slot="sidebar"] [data-slot="submenu"] {
  display: flex;
  flex-direction: column;
  gap: var(--space-inline-sm);
  margin: 0;
  margin-block-start: var(--space-inline-sm);
  padding: 0;
  padding-inline-start: var(--space-inline-md);
  border-inline-start: var(--border-width) solid var(--border-subtle);
  list-style: none;
}
[data-slot="sidebar"] [data-slot="submenu"][data-state="open"] {
  animation: sidebar-submenu-expand var(--duration-fast) var(--easing-standard);
}
@keyframes sidebar-submenu-expand {
  from { opacity: 0; }
  to { opacity: 1; }
}

/* separator */
[data-slot="sidebar"] [data-slot="separator"] {
  block-size: var(--border-width);
  margin-block: var(--space-stack-sm);
  background: var(--border-subtle);
}

/* footer */
[data-slot="sidebar"] [data-slot="footer"] {
  display: flex;
  flex-direction: column;
  gap: var(--space-stack-sm);
  padding: var(--inset-container);
  padding-block-start: var(--space-stack-sm);
  border-block-start: var(--border-width) solid var(--border-subtle);
}

@media (prefers-reduced-motion: reduce) {
  [data-slot="sidebar"],
  [data-slot="sidebar"] [data-slot="trigger"],
  [data-slot="sidebar"] [data-slot="menu-button"] { transition: none; }
  [data-slot="sidebar"] [data-slot="submenu"][data-state="open"] { animation: none; }
}

/* LIFTED from shadcn/skeleton.tsx via scripts/lift.py — the dictionary run in reverse.
   Review against contract/anatomy/skeleton.json + the button exemplar before accepting.
   Unmapped words: see skeleton.lift-report.json */

[data-slot="skeleton"] {
  border-radius: var(--radius-control);
  background: var(--interaction-hover);
}

/* Slider recipe — contract slots only. Anatomy: contract/anatomy/slider.json */

[data-slot="slider"] {
  display: flex;
  align-items: center;
  gap: var(--space-inline-md);
  inline-size: 100%;
}
[data-slot="slider"][data-orientation="vertical"] {
  flex-direction: column;
  inline-size: auto;
  block-size: 10rem;
}
[data-slot="slider"] [data-slot="track"] {
  position: relative;
  flex: 1;
  block-size: calc(var(--space-unit) * 1.5);
  background: var(--field-border);
  border-radius: var(--radius-pill);
}
[data-slot="slider"][data-size="sm"] [data-slot="track"] { block-size: var(--space-unit); }
[data-slot="slider"][data-size="lg"] [data-slot="track"] { block-size: calc(var(--space-unit) * 2); }
[data-slot="slider"][data-orientation="vertical"] [data-slot="track"] {
  inline-size: calc(var(--space-unit) * 1.5);
  block-size: auto;
  inline-size: calc(var(--space-unit) * 1.5);
}
[data-slot="slider"] [data-slot="range"] {
  position: absolute;
  inset-block: 0;
  inset-inline-start: 0;
  background: var(--action);
  border-radius: var(--radius-pill);
}
[data-slot="slider"][data-orientation="vertical"] [data-slot="range"] {
  inset-inline: 0;
  inset-block-start: auto;
  inset-block-end: 0;
}
[data-slot="slider"] [data-slot="thumb"] {
  position: absolute;
  inset-block-start: 50%;
  inline-size: var(--icon-size-control);
  block-size: var(--icon-size-control);
  background: var(--surface-raised);
  border: var(--border-width-strong) solid var(--action);
  border-radius: var(--radius-pill);
  box-shadow: var(--elevation-resting);
  transform: translate(-50%, -50%);
  cursor: var(--cursor-grab);
  transition: box-shadow var(--duration-fast) var(--easing-standard);
}
[data-slot="slider"][data-orientation="vertical"] [data-slot="thumb"] {
  inset-block-start: auto;
  inset-inline-start: 50%;
  transform: translate(-50%, 50%);
}
[data-slot="slider"] [data-slot="thumb"]:focus-visible {
  outline: var(--focus-width) solid color-mix(in oklab, var(--focus) 50%, transparent);
  outline-offset: var(--focus-offset);
}
[data-slot="slider"] [data-slot="value-label"] {
  font: var(--type-data);
  color: var(--content-secondary);
  min-inline-size: calc(var(--space-unit) * 8);
  text-align: end;
}
[data-slot="slider"][data-disabled] {
  opacity: 0.5;
  pointer-events: none;
  cursor: var(--cursor-disabled);
}
@media (prefers-reduced-motion: reduce) {
  [data-slot="slider"] [data-slot="thumb"] { transition: none; }
}

/* Sonner recipe — contract slots only (contract/authoring.md step 3).
   Structure and states: contract/anatomy/sonner.json. Character: the theme.

   This is the region recipe. A toast's own chrome — tone, icon, title,
   description — belongs to anatomy/toast.json and is not restated here; the
   region only gives the item its overlay surface and its place in the stack. */

/* root — the live region: a stack anchored to one viewport edge */
[data-slot="sonner"] {
  position: fixed;
  z-index: var(--layer-notification);
  display: flex;
  flex-direction: column;
  gap: var(--space-stack-sm);
  width: var(--size-overlay-sm);
  max-width: calc(100% - var(--inset-container) * 2);
  padding: var(--inset-container);
  pointer-events: none;
}
[data-slot="sonner"] > * {
  pointer-events: auto;
}

/* edge axis — the viewport edge the stack anchors to. New toasts enter at
   that edge, so the stack grows away from it: an end/bottom-anchored stack
   reverses its column direction. Logical edge names survive RTL. */
[data-slot="sonner"][data-edge="bottom"] {
  bottom: 0;
  inset-inline: 0;
  margin-inline: auto;
  flex-direction: column-reverse;
}
[data-slot="sonner"][data-edge="top"] {
  top: 0;
  inset-inline: 0;
  margin-inline: auto;
}
[data-slot="sonner"][data-edge="start"] {
  bottom: 0;
  inset-inline-start: 0;
  flex-direction: column-reverse;
}
[data-slot="sonner"][data-edge="end"] {
  bottom: 0;
  inset-inline-end: 0;
  flex-direction: column-reverse;
}

/* toast — the region's repeating child */
[data-slot="sonner"] [data-slot="toast"] {
  display: flex;
  align-items: flex-start;
  gap: var(--space-inline-md);
  padding: var(--inset-container);
  border: var(--border-width) solid var(--border);
  border-radius: var(--radius-overlay);
  background: var(--surface-overlay);
  color: var(--on-surface-overlay);
  box-shadow: var(--elevation-overlay);
  animation: sonner-toast-enter var(--duration-base) var(--easing-enter);
  transition: transform var(--duration-base) var(--easing-standard);
}
[data-slot="sonner"] [data-slot="toast-content"] {
  flex: 1;
  min-width: 0;
  font: var(--type-body);
}

/* the dismiss control stays a normal tab stop — the timer pause is what
   makes reaching it possible, not a change to the tab order */
[data-slot="sonner"] [data-slot="toast-close"] {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  padding: var(--space-unit);
  border: none;
  border-radius: var(--radius-control);
  background: transparent;
  color: var(--content-secondary);
  cursor: var(--cursor-interactive);
  outline: none;
  transition:
    background-color var(--duration-fast) var(--easing-standard),
    color var(--duration-fast) var(--easing-standard);
}
[data-slot="sonner"] [data-slot="toast-close"]:hover {
  background: var(--interaction-hover);

}

[data-slot="table"] > [data-slot="caption"] {

  font: var(--type-caption);
  color: var(--content-secondary);
}

/* header-row: bottom rule separates header from body (anatomy note) */
[data-slot="table"] [data-slot="header-row"] {
  border-bottom: var(--border-width) solid var(--border);
}

[data-slot="table"] [data-slot="header-cell"] {
  height: var(--control-height-md);
  padding-inline: var(--inset-control-x);

}
[data-slot="table"] [data-slot="row"]:last-child {

}

/* states (contract/states.md) — hover reads as affordance only when rows

[data-slot="table"] [data-slot="row"]:hover {
  background: var(--interaction-hover);
}
[data-slot="table"] [data-slot="row"]:focus-visible {
  outline: var(--focus-width) solid color-mix(in oklab, var(--focus) 60%, transparent);
  outline-offset: var(--focus-offset);
}
[data-slot="table"] [data-slot="row"][data-state="selected"] {
  background: var(--interaction-selected);
  color: var(--on-interaction-selected);
}

[data-slot="table"] [data-slot="cell"] {

/* numeric columns: type-data (tabular numerals), end-aligned */

[data-slot="table"][data-size="lg"] [data-slot="cell"] {

@media (prefers-reduced-motion: reduce) {

  padding-inline: var(--space-inline-sm);

[data-slot="tooltip"][data-side="bottom"] {

<style>/* Showroom chrome — deliberately NOT themed. The only themed element on the
   page is .canvas, so you are always looking at a component in a theme,
   never at a themed website. Chrome uses its own neutral scale. */

:root {
  --ui-bg: #ffffff;
  --ui-panel: #fafafa;
  --ui-fg: #18181b;
  --ui-dim: #71717a;
  --ui-line: #e4e4e7;
  --ui-accent: #2563eb;
  --ui-accent-soft: #eff6ff;
  --ui-font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --ui-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --ui-bg: #0b0b0d; --ui-panel: #141417; --ui-fg: #fafafa;
    --ui-dim: #a1a1aa; --ui-line: #27272a; --ui-accent: #60a5fa; --ui-accent-soft: #172554;
  }
}

*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; background: var(--ui-bg); color: var(--ui-fg);
       font-family: var(--ui-font); font-size: 13px; }
#root { block-size: 100vh; }

.shell {
  display: grid;
  grid-template-columns: 232px minmax(0, 1fr) 288px;
  block-size: 100vh;
}
@media (max-width: 1100px) { .shell { grid-template-columns: 200px minmax(0,1fr); } .panel { display: none; } }

/* ---------------- tree ---------------- */
.tree {
  border-inline-end: 1px solid var(--ui-line);
  background: var(--ui-panel);
  display: flex; flex-direction: column; overflow: hidden;
}
.tree-head { padding: 16px 16px 10px; }
.tree-head b { display: block; font-size: 14px; letter-spacing: -0.01em; }
.tree-head small { color: var(--ui-dim); font-size: 11px; }
.filter {
  margin: 0 12px 8px; padding: 6px 9px; font: inherit; font-size: 12px;
  border: 1px solid var(--ui-line); border-radius: 7px;
  background: var(--ui-bg); color: var(--ui-fg);
}
.filter:focus { outline: 2px solid var(--ui-accent); outline-offset: -1px; }
.tree nav { flex: 1; overflow-y: auto; padding: 4px 8px 16px; }
.tree-group { margin-block-end: 10px; }
.tree-group-label {
  display: block; padding: 6px 8px 4px; font-size: 10px; font-weight: 600;
  text-transform: uppercase; letter-spacing: 0.07em; color: var(--ui-dim);
}
.tree nav button {
  display: block; inline-size: 100%; text-align: start; border: 0; background: none;
  color: var(--ui-fg); font: inherit; font-size: 12.5px; padding: 5px 9px;
  border-radius: 6px; cursor: pointer;
}
.tree nav button:hover { background: var(--ui-line); }
.tree nav button[aria-current] { background: var(--ui-accent-soft); color: var(--ui-accent); font-weight: 600; }
.tree-foot { padding: 10px 16px; border-block-start: 1px solid var(--ui-line);
             color: var(--ui-dim); font-size: 11px; }

/* ---------------- stage ---------------- */
.stage { display: flex; flex-direction: column; overflow: hidden; }
.stage-bar {
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  padding: 14px 20px; border-block-end: 1px solid var(--ui-line);
}
.stage-bar h1 { margin: 0; font-size: 15px; font-weight: 600; letter-spacing: -0.01em; }
.behavior { color: var(--ui-dim); font-size: 11.5px; }
.spacer { flex: 1; }
.tabs { display: flex; gap: 2px; }
.tabs button {
  border: 0; background: none; color: var(--ui-dim); font: inherit; font-size: 12px;
  padding: 5px 10px; border-radius: 6px; cursor: pointer; text-transform: capitalize;
}
.tabs button:hover { background: var(--ui-line); color: var(--ui-fg); }
.tabs button[aria-current] { background: var(--ui-accent-soft); color: var(--ui-accent); font-weight: 600; }

/* the themed island */
.canvas {
  flex: 1; overflow: auto; display: grid; place-items: center; padding: 40px;
  background: var(--surface); color: var(--on-surface); font-family: var(--family-body);
  isolation: isolate; transform: translateZ(0);   /* contains position:fixed */
  position: relative;
}
.canvas-inner { max-inline-size: 100%; }

.compare { flex: 1; overflow: auto; display: grid; gap: 1px; background: var(--ui-line);
           grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); }
.compare figure { margin: 0; display: flex; flex-direction: column; background: var(--ui-bg); }
.compare figcaption { padding: 8px 14px; font-size: 11px; font-weight: 600;
                      color: var(--ui-dim); border-block-end: 1px solid var(--ui-line); }
.compare .canvas { padding: 32px; min-block-size: 240px; }

[data-story-error] { display: grid; gap: 6px; font-family: var(--ui-mono); font-size: 11px; color: #dc2626; }

/* docs tabs */
.doc { flex: 1; overflow: auto; padding: 24px 28px; max-inline-size: 760px; }
.doc h2 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.07em;
          color: var(--ui-dim); margin: 22px 0 8px; }
.doc h2:first-child { margin-block-start: 0; }
.doc p { color: var(--ui-dim); line-height: 1.6; margin: 0 0 10px; }
.doc code { font-family: var(--ui-mono); font-size: 11.5px; }
.pill-list { list-style: none; display: flex; flex-wrap: wrap; gap: 6px; padding: 0; margin: 0; }
.pill-list li { background: var(--ui-panel); border: 1px solid var(--ui-line);
                border-radius: 999px; padding: 3px 10px; font-size: 11.5px;
                font-family: var(--ui-mono); }
.cmd { background: var(--ui-panel); border: 1px solid var(--ui-line); border-radius: 8px;
       padding: 12px 14px; font-family: var(--ui-mono); font-size: 11.5px;
       overflow-x: auto; white-space: pre; margin: 0 0 6px; }
.token-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px; }
.token-row { display: flex; align-items: center; gap: 8px; }
.token-chip { inline-size: 22px; block-size: 22px; border-radius: 5px;
              border: 1px solid var(--ui-line); flex: none; }

/* ---------------- panel ---------------- */
.panel {
  border-inline-start: 1px solid var(--ui-line); background: var(--ui-panel);
  padding: 16px; overflow-y: auto;
}
.panel h2 { font-size: 10px; text-transform: uppercase; letter-spacing: 0.07em;
            color: var(--ui-dim); margin: 20px 0 10px; }
.panel h2:first-child { margin-block-start: 0; }
.ctrl-field { margin-block-end: 12px; }
.ctrl-field label { display: block; font-size: 11px; color: var(--ui-dim); margin-block-end: 5px; }
.ctrl-field label em { font-style: normal; cursor: help; }
.ctrl-field select {
  inline-size: 100%; font: inherit; font-size: 12px; padding: 5px 8px;
  border: 1px solid var(--ui-line); border-radius: 6px;
  background: var(--ui-bg); color: var(--ui-fg);
}
.segmented { display: flex; gap: 2px; background: var(--ui-bg);
             border: 1px solid var(--ui-line); border-radius: 7px; padding: 2px; }
.segmented button {
  flex: 1; border: 0; background: none; color: var(--ui-dim); font: inherit;
  font-size: 11px; padding: 4px 6px; border-radius: 5px; cursor: pointer;
  text-transform: capitalize;
}
.segmented button[aria-pressed="true"] { background: var(--ui-accent-soft); color: var(--ui-accent); font-weight: 600; }
.segmented[data-disabled] { opacity: 0.45; }
.check { display: flex; align-items: center; gap: 7px; font-size: 12px;
         margin-block-end: 7px; cursor: pointer; }
.muted { color: var(--ui-dim); font-size: 11.5px; }
.constraints { padding-inline-start: 16px; margin: 0; color: var(--ui-dim);
               font-size: 11px; line-height: 1.55; }
.constraints li { margin-block-end: 6px; }
</style>
