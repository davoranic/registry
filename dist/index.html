  color: var(--content-secondary);
  text-align: center;
}

[data-slot="empty"] > [data-slot="header"] {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: var(--space-stack-sm);
}

[data-slot="empty"] [data-slot="media"] {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: var(--inset-container);
  border-radius: var(--radius-container);
  background: var(--surface-sunken);
  color: var(--on-surface);
}
[data-slot="empty"] [data-slot="media"] svg {
  width: var(--icon-size-emphasis);
  height: var(--icon-size-emphasis);
  stroke-width: var(--icon-stroke);
}

[data-slot="empty"] [data-slot="title"] {
  margin: 0;
  font: var(--type-heading-3);
  color: var(--on-surface);
}

[data-slot="empty"] [data-slot="description"] {
  margin: 0;
  font: var(--type-body);
  color: var(--content-secondary);
}

[data-slot="empty"] > [data-slot="content"] {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: center;
  gap: var(--space-inline-md);
  margin-block-start: var(--space-stack-md);
}

/* Field recipe — contract slots only. Anatomy: contract/anatomy/field.json */

[data-slot="field"] {
  display: flex;
  flex-direction: column;
  gap: calc(var(--space-unit) * 1.5);
}
[data-slot="field"][data-orientation="horizontal"] {
  flex-direction: row;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-inline-lg);
}
[data-slot="field"] > [data-slot="label"] {
  font: var(--type-label);
  color: var(--on-surface);
}
[data-slot="control-slot"] { display: flex; flex-direction: column; }
[data-slot="field"][data-orientation="horizontal"] [data-slot="control-slot"] { flex-shrink: 0; }
[data-slot="field"] > [data-slot="description"] {
  font: var(--type-caption);
  color: var(--content-secondary);
}
[data-slot="field"] > [data-slot="error"] {
  font: var(--type-caption);
  color: var(--status-critical);
}
[data-slot="field"][data-state="readonly"] > [data-slot="label"] { color: var(--content-secondary); }
[data-slot="field"][data-disabled] {
  opacity: 0.5;
  pointer-events: none;
  cursor: var(--cursor-disabled);
}

/* Form recipe — contract slots only (contract/authoring.md step 3).
   Structure, label-placement axis and states: contract/anatomy/form.json.
   Description and message are two parts, only one of which renders at a
   time — the superset both shadcn and Salt can express. */

[data-slot="form"] {
  display: flex;
  flex-direction: column;
  gap: var(--space-stack-lg);
}

/* item */
[data-slot="form"] [data-slot="item"] {
  display: flex;
  flex-direction: column;
  gap: var(--space-stack-sm);
}
[data-slot="form"][data-label-placement="start"] [data-slot="item"] {
  display: grid;
  grid-template-columns: auto 1fr;
  align-items: baseline;
  column-gap: var(--space-inline-lg);
  row-gap: var(--space-stack-sm);
}
[data-slot="form"][data-label-placement="start"] [data-slot="item"] > [data-slot="control"],
[data-slot="form"][data-label-placement="start"] [data-slot="item"] > [data-slot="description"],
[data-slot="form"][data-label-placement="start"] [data-slot="item"] > [data-slot="message"] {
  grid-column: 2;
}

/* label */
[data-slot="form"] [data-slot="label"] {
  display: inline-flex;
  align-items: center;
  gap: var(--space-inline-sm);
  font: var(--type-label);
  color: var(--on-surface);
}
[data-slot="form"] [data-slot="label"] [data-slot="necessity"] {
  font: var(--type-caption);
  color: var(--content-secondary);
}

/* control — hosts a control anatomy; no tokens of its own */
[data-slot="form"] [data-slot="control"] {
  display: flex;
  flex-direction: column;
  min-width: 0;
}

/* description */
[data-slot="form"] [data-slot="description"] {
  margin: 0;
  font: var(--type-caption);
  color: var(--content-secondary);
}

/* message — icon + text, so failure is never signalled by colour alone */
[data-slot="form"] [data-slot="message"] {
  display: flex;
  align-items: center;
  gap: var(--space-inline-sm);
  margin: 0;
  font: var(--type-caption);
  color: var(--status-critical);
  animation: form-message-enter var(--duration-fast) var(--easing-enter);
}
[data-slot="form"] [data-slot="message"] svg {
  flex-shrink: 0;
  width: var(--icon-size-inline);
  height: var(--icon-size-inline);
  stroke-width: var(--icon-stroke);
}
@keyframes form-message-enter {
  from { opacity: 0; }
  to { opacity: 1; }
}

/* states (contract/states.md) */
[data-slot="form"] [data-slot="label"][data-state="invalid"] {
  color: var(--status-critical);
}
[data-slot="form"] [data-slot="item"][data-state="readonly"] [data-slot="label"] {
  color: var(--content-secondary);
}
[data-slot="form"] [data-slot="item"][data-disabled] {
  opacity: 0.5;
  pointer-events: none;
  cursor: var(--cursor-disabled);
}
[data-slot="form"] [data-slot="label"][data-disabled] {
  color: var(--content-disabled);
}

@media (prefers-reduced-motion: reduce) {
  [data-slot="form"] [data-slot="message"] { animation: none; }
}

/* Hover-card recipe — contract slots only (contract/authoring.md step 3).
   Structure and states: contract/anatomy/hover-card.json. Character: the theme.

   The panel takes the overlay surface rather than tooltip's inverse-surface
   because inverted chrome cannot carry rich content legibly — a recipe
   consequence of the invocation, not a different anatomy. */

[data-slot="hover-card"] {
  position: relative;
  display: inline-flex;
}

/* trigger — conventionally a link or a name; must be focusable so the card
   has a keyboard route */
[data-slot="hover-card"] > [data-slot="trigger"] {
  font: var(--type-action);
  color: var(--link);
  text-decoration: var(--link-decoration);
  text-underline-offset: var(--link-decoration-offset);
  cursor: var(--cursor-interactive);
}
[data-slot="hover-card"] > [data-slot="trigger"]:focus-visible {
  outline: var(--focus-width) var(--focus-style) color-mix(in oklab, var(--focus) 60%, transparent);
  outline-offset: var(--focus-offset);
}

/* panel */
[data-slot="hover-card"] [data-slot="panel"] {
  position: absolute;
  z-index: var(--layer-dropdown);
  width: max-content;
  max-width: var(--size-overlay-sm);
  padding: var(--inset-container);
  border: var(--border-width) solid var(--border);
  border-radius: var(--radius-overlay);
  background: var(--surface-overlay);
  color: var(--on-surface-overlay);
  font: var(--type-body);
  box-shadow: var(--elevation-overlay);
}

/* placement — logical sides survive RTL */
[data-slot="hover-card"] [data-slot="panel"][data-side="bottom"] {
  top: 100%;
  inset-inline-start: 0;
  margin-block-start: var(--space-stack-sm);
}
[data-slot="hover-card"] [data-slot="panel"][data-side="top"] {
  bottom: 100%;
  inset-inline-start: 0;
  margin-block-end: var(--space-stack-sm);
}
[data-slot="hover-card"] [data-slot="panel"][data-side="start"] {
  top: 0;
  inset-inline-end: 100%;
  margin-inline-end: var(--space-inline-sm);
}
[data-slot="hover-card"] [data-slot="panel"][data-side="end"] {
  top: 0;
  inset-inline-start: 100%;
  margin-inline-start: var(--space-inline-sm);
}

/* arrow — fill always matches the panel surface recipe */
[data-slot="hover-card"] [data-slot="arrow"] {
  position: absolute;
  width: var(--icon-size-inline);
  height: var(--icon-size-inline);
  background: var(--surface-overlay);
  border: var(--border-width) solid var(--border);
  transform: rotate(45deg);
}
[data-slot="hover-card"] [data-slot="panel"][data-side="bottom"] [data-slot="arrow"] {
  bottom: 100%;
  inset-inline-start: var(--inset-container);
  margin-block-end: calc(var(--icon-size-inline) / -2);
  clip-path: polygon(0 0, 100% 0, 0 100%);
}
[data-slot="hover-card"] [data-slot="panel"][data-side="top"] [data-slot="arrow"] {
  top: 100%;
  inset-inline-start: var(--inset-container);
  margin-block-start: calc(var(--icon-size-inline) / -2);
  clip-path: polygon(100% 0, 100% 100%, 0 100%);
}
[data-slot="hover-card"] [data-slot="panel"][data-side="start"] [data-slot="arrow"] {
  top: var(--inset-container);
  inset-inline-start: 100%;
  margin-inline-start: calc(var(--icon-size-inline) / -2);
  clip-path: polygon(100% 0, 100% 100%, 0 0);
}
[data-slot="hover-card"] [data-slot="panel"][data-side="end"] [data-slot="arrow"] {
  top: var(--inset-container);
  inset-inline-end: 100%;
  margin-inline-end: calc(var(--icon-size-inline) / -2);
  clip-path: polygon(0 0, 100% 100%, 0 100%);
}

/* motion — enter duration-fast/easing-enter (anatomy motion block) */
[data-slot="hover-card"] [data-slot="panel"][data-state="open"] {
  animation: hover-card-panel-enter var(--duration-fast) var(--easing-enter);
}
@keyframes hover-card-panel-enter {
  from { opacity: 0; }
  to { opacity: 1; }
}

@media (prefers-reduced-motion: reduce) {
  [data-slot="hover-card"] [data-slot="panel"][data-state="open"] { animation: none; }
}

/* Icon recipe — contract slots only (contract/authoring.md step 3).
   Structure: contract/anatomy/icon.json. Character: the theme.
   The icon declares no colour slot: it inherits currentColor so it speaks with
   the voice of whatever contains it. */

[data-slot="icon"] {
  display: inline-block;
  flex: none;
  width: var(--icon-size-control);
  height: var(--icon-size-control);
  color: currentColor;
  vertical-align: middle;
}

/* size axis — the icon ramp, not control-height-* */
[data-slot="icon"][data-size="sm"] {
  width: var(--icon-size-inline);
  height: var(--icon-size-inline);
}
[data-slot="icon"][data-size="lg"] {
  width: var(--icon-size-emphasis);
  height: var(--icon-size-emphasis);
}

/* glyph: fill vs stroke follows the set's style, weight follows the theme */
[data-slot="icon"][data-icon-style="outline"] [data-slot="glyph"] {
  fill: none;
  stroke: currentColor;
  stroke-width: var(--icon-stroke);
}
[data-slot="icon"][data-icon-style="filled"] [data-slot="glyph"] {
  fill: currentColor;
  stroke: none;
}

/* the only state: indeterminate work */
[data-slot="icon"][data-state="loading"] {
  animation: icon-spin var(--duration-slow) linear infinite;
}
@keyframes icon-spin {
  to {
    transform: rotate(360deg);
  }
}
@media (prefers-reduced-motion: reduce) {
  [data-slot="icon"][data-state="loading"] {
    animation: none;
  }
}

/* LIFTED from shadcn/input.tsx via scripts/lift.py — the dictionary run in reverse.
   Review against contract/anatomy/input.json + the button exemplar before accepting.
   Unmapped words: see input.lift-report.json */

[data-slot="input"] {
  height: var(--control-height-md);
  width: 100%;
  min-width: 0;
  border-radius: var(--radius-control);
  border: var(--border-width) solid var(--border);
  border-color: var(--field-border);
  background: transparent;
  padding-inline: calc(var(--space-unit) * 3);
  padding-block: var(--space-unit);
  font-size: var(--text-ui);
  box-shadow: var(--elevation-resting);
  transition: color var(--duration-fast) var(--easing-standard), box-shadow var(--duration-fast) var(--easing-standard);
  outline: none;
}

[data-slot="input"] [data-slot="control"]::placeholder {
  color: var(--content-secondary);
}

[data-slot="input"]:disabled {
  pointer-events: none;
  cursor: var(--cursor-disabled);
  opacity: 0.5;
}

[data-slot="input"] { display: inline-flex; align-items: center; width: 100%; }
[data-slot="input"] [data-slot="control"] { all: unset; flex: 1; min-width: 0; font: inherit; color: var(--on-surface); }
[data-slot="input"] [data-slot="control"]:disabled { opacity: 0.5; cursor: var(--cursor-disabled); }

/* Input-group recipe — contract slots only (contract/authoring.md step 3).
   Structure, size/edge axes and states: contract/anatomy/input-group.json.
   The group paints the field chrome; the hosted control renders bare. */

[data-slot="input-group"] {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  width: 100%;
  min-width: 0;
  min-block-size: var(--control-height-md);
  border: var(--border-width) solid var(--field-border);
  border-radius: var(--radius-control);
  background: var(--field-surface);
  box-shadow: var(--elevation-resting);
  transition:
    border-color var(--duration-fast) var(--easing-standard),
    background-color var(--duration-fast) var(--easing-standard);
}

/* size axis */
[data-slot="input-group"][data-size="sm"] { min-block-size: var(--control-height-sm); }
[data-slot="input-group"][data-size="lg"] { min-block-size: var(--control-height-lg); }

/* control — borderless, fills the row */
[data-slot="input-group"] [data-slot="control"] {
  flex: 1 1 auto;
  order: 0;
  min-width: 0;
  align-self: stretch;
  padding-inline: var(--inset-control-x);
  padding-block: 0;
  border: none;
  background: transparent;
  color: var(--on-surface);
  font: var(--type-label);
  outline: none;
}
[data-slot="input-group"] [data-slot="control"]::placeholder {
  color: var(--content-secondary);
}
[data-slot="input-group"] textarea[data-slot="control"] {
  padding-block: var(--space-unit);
  resize: vertical;
}

/* addon — the edge axis places it */
[data-slot="input-group"] [data-slot="addon"] {
  display: flex;
  align-items: center;
  gap: var(--space-inline-md);
  padding-inline: var(--inset-control-x);
  color: var(--content-secondary);
  font: var(--type-label);
  white-space: nowrap;
}
[data-slot="input-group"] [data-slot="addon"] svg {
  width: var(--icon-size-control);
  height: var(--icon-size-control);
  stroke-width: var(--icon-stroke);
}
[data-slot="addon"][data-edge="inline-start"] { order: -1; }
[data-slot="addon"][data-edge="inline-end"] { order: 1; }
[data-slot="addon"][data-edge="block-start"] {
  order: -2;
  flex-basis: 100%;
  padding-block: var(--space-unit);
  border-block-end: var(--border-width) solid var(--border-subtle);
}
[data-slot="addon"][data-edge="block-end"] {
  order: 2;
  flex-basis: 100%;
  padding-block: var(--space-unit);
  border-block-start: var(--border-width) solid var(--border-subtle);
}

/* an addon that is only an affix must not eat the click target */
[data-slot="input-group"] [data-slot="addon"] + [data-slot="control"] {
  padding-inline-start: 0;
}

/* states (contract/states.md) */
[data-slot="input-group"]:hover {
  border-color: var(--field-border-hover);
  background: var(--field-surface-hover);
}
[data-slot="input-group"]:focus-within {
  border-color: var(--field-border-active);
  outline: var(--focus-width) var(--focus-style)
    color-mix(in oklab, var(--focus) 60%, transparent);
  outline-offset: var(--focus-offset);
}
[data-slot="input-group"][data-state="invalid"] {
  border-color: var(--status-critical);
}
[data-slot="input-group"][data-state="invalid"]:focus-within {
  outline-color: color-mix(in oklab, var(--status-critical) 60%, transparent);
}
[data-slot="input-group"][data-state="readonly"] {
  background: var(--surface-sunken);
  color: var(--content-secondary);
}
[data-slot="input-group"][data-state="readonly"]:hover {
  border-color: var(--field-border);
  background: var(--surface-sunken);
}
[data-slot="input-group"][data-disabled] {
  opacity: 0.5;
  pointer-events: none;
  cursor: var(--cursor-disabled);
}

@media (prefers-reduced-motion: reduce) {
  [data-slot="input-group"] { transition: none; }
}

/* Input-OTP recipe — contract slots only (contract/authoring.md step 3).
   Structure, size axis, states and motion: contract/anatomy/input-otp.json.
   A cell is a one-character input face and reuses field-border /
   field-surface / radius-control exactly, so no theme needs a new slot.
   Rounding every cell is this recipe's choice; a segmented-strip theme
   rounds only the group's outer corners — the same parts either way. */

[data-slot="input-otp"] {
  position: relative;
  display: inline-flex;
  align-items: center;
  gap: var(--space-inline-md);
  width: fit-content;
}

/* control — the one real input: it owns the value, the focus and the tab
   stop, and lies invisible over the cells */
[data-slot="input-otp"] > [data-slot="control"] {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  padding: 0;
  border: none;
  background: transparent;
  color: transparent;
  caret-color: transparent;
  letter-spacing: 100%;
  outline: none;
  opacity: 0;
}

/* group — a run of adjacent cells */
[data-slot="input-otp"] [data-slot="group"] {
  display: flex;
  align-items: center;
  gap: var(--space-inline-sm);
}

/* cell */
[data-slot="input-otp"] [data-slot="cell"] {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  width: var(--control-height-md);
  height: var(--control-height-md);
  border: var(--border-width) solid var(--field-border);
  border-radius: var(--radius-control);
  background: var(--field-surface);
  color: var(--on-surface);
  font: var(--type-label);
  transition:
    border-color var(--duration-fast) var(--easing-standard),
    background-color var(--duration-fast) var(--easing-standard);
}

/* size axis */
[data-slot="input-otp"][data-size="sm"] [data-slot="cell"] {
  width: var(--control-height-sm);
  height: var(--control-height-sm);
}
[data-slot="input-otp"][data-size="lg"] [data-slot="cell"] {
  width: var(--control-height-lg);
  height: var(--control-height-lg);
}

/* caret — the blinking bar on the active empty cell; decorative */
[data-slot="input-otp"] [data-slot="caret"] {
  position: absolute;
  width: var(--border-width-strong);
  height: 50%;
  background: var(--on-surface);
  animation: input-otp-caret-blink var(--duration-slow) var(--easing-standard) infinite;
}
@keyframes input-otp-caret-blink {
  0%, 45% { opacity: 1; }
  55%, 100% { opacity: 0; }
}

/* separator — the dash between cell groups */
[data-slot="input-otp"] > [data-slot="separator"] {
  display: inline-flex;
  align-items: center;
  margin-inline: var(--space-inline-md);
  color: var(--content-secondary);
}
[data-slot="input-otp"] > [data-slot="separator"] svg {
  width: var(--icon-size-inline);
  height: var(--icon-size-inline);
  stroke-width: var(--icon-stroke);
}

/* states (contract/states.md) — the cell under the caret takes
   field-border-active plus the focus ring */
[data-slot="input-otp"] [data-slot="cell"][data-active] {
  border-color: var(--field-border-active);
  outline: var(--focus-width) var(--focus-style)
    color-mix(in oklab, var(--focus) 60%, transparent);
  outline-offset: var(--focus-offset);
  z-index: var(--layer-sticky);
}
[data-slot="input-otp"][data-state="invalid"] [data-slot="cell"] {
  border-color: var(--status-critical);
}
[data-slot="input-otp"][data-state="invalid"] [data-slot="cell"][data-active] {
  outline-color: color-mix(in oklab, var(--status-critical) 60%, transparent);
}
[data-slot="input-otp"][data-state="readonly"] [data-slot="cell"] {
  background: var(--surface-sunken);
  color: var(--content-secondary);
}
[data-slot="input-otp"][data-disabled] {
  opacity: 0.5;
  pointer-events: none;
  cursor: var(--cursor-disabled);
}

@media (prefers-reduced-motion: reduce) {
  [data-slot="input-otp"] [data-slot="cell"] { transition: none; }
  [data-slot="input-otp"] [data-slot="caret"] { animation: none; }
}

/* Item recipe — contract slots only (contract/authoring.md step 3).
   Structure, prominence/size axes and states: contract/anatomy/item.json.
   Item is card's row-shaped sibling: the same content parts at control scale
   spacing and radius instead of container scale. */

[data-slot="item"] {
  display: flex;
  align-items: center;
  gap: var(--space-inline-lg);
  width: 100%;
  padding: var(--space-unit) var(--inset-control-x);
  border: var(--border-width) solid transparent;
  border-radius: var(--radius-control);
  background: transparent;
  color: var(--on-surface);
  font: var(--type-label);
  text-align: start;
  text-decoration: none;
  transition:
    background-color var(--duration-fast) var(--easing-standard),
    border-color var(--duration-fast) var(--easing-standard),
    color var(--duration-fast) var(--easing-standard);
}
[data-slot="item"][data-interactive] {
  cursor: var(--cursor-interactive);
}

/* size axis */
[data-slot="item"][data-size="sm"] {
  gap: var(--space-inline-md);
  padding: calc(var(--space-unit) * 0.5) calc(var(--inset-control-x) * 0.75);
}
[data-slot="item"][data-size="lg"] {
  gap: var(--space-inline-lg);
  padding: calc(var(--space-unit) * 2) calc(var(--inset-control-x) * 1.25);
}

/* prominence axis — shadcn default|outline|muted decomposes onto
   ghost|outline|solid (anatomyNotes) */
[data-slot="item"][data-prominence="ghost"] {
  background: transparent;
  border-color: transparent;
}
[data-slot="item"][data-prominence="outline"] {
  border-color: var(--border);
}
[data-slot="item"][data-prominence="solid"] {
  background: var(--surface-sunken);
  border-color: transparent;
}

/* media — top-aligns once a description is present */
[data-slot="item"] > [data-slot="media"] {
  display: inline-flex;
  flex-shrink: 0;
  align-items: center;
  justify-content: center;
  align-self: center;
  padding: var(--space-unit);
  border: var(--border-width) solid var(--border);
  border-radius: var(--radius-field-control);
  background: var(--surface-sunken);
  overflow: hidden;
}
[data-slot="item"]:has([data-slot="description"]) > [data-slot="media"] {
  align-self: flex-start;
}
[data-slot="item"] > [data-slot="media"] svg {
  width: var(--icon-size-control);
  height: var(--icon-size-control);
  stroke-width: var(--icon-stroke);
}

/* content — stacks title over description, takes the remaining inline space */
[data-slot="item"] > [data-slot="content"] {
  display: flex;
  flex: 1;
  flex-direction: column;
  gap: var(--space-stack-sm);
  min-width: 0;
}
[data-slot="item"] [data-slot="title"] {
  font: var(--type-label);
  color: var(--on-surface);
}
[data-slot="item"] [data-slot="description"] {
  font: var(--type-body);
  color: var(--content-secondary);
}

/* actions */
[data-slot="item"] > [data-slot="actions"] {
  display: flex;
  flex-shrink: 0;
  align-items: center;
  gap: var(--space-inline-md);
}

/* group + separator */
[data-slot="item"] [data-slot="group"] {
  display: flex;
  flex-direction: column;
  margin: 0;
  padding: 0;
  list-style: none;
}
[data-slot="item"] [data-slot="group"] > li {
  display: block;
}
[data-slot="separator"] {
  height: var(--border-width);
  margin-block: var(--space-stack-sm);
  background: var(--border-subtle);
  list-style: none;
}

/* states (contract/states.md) — hover/selected apply only when interactive */
[data-slot="item"][data-interactive]:hover {
  background: var(--interaction-hover);
}
[data-slot="item"][data-state="selected"] {
  background: var(--interaction-selected);
  color: var(--on-interaction-selected);
}
[data-slot="item"][data-state="selected"] [data-slot="title"] {
  color: var(--on-interaction-selected);
}
[data-slot="item"]:focus-visible {
  outline: var(--focus-width) var(--focus-style)
    color-mix(in oklab, var(--focus) 60%, transparent);
  outline-offset: var(--focus-offset);
}
[data-slot="item"][data-disabled] {
  opacity: 0.5;
  pointer-events: none;
  cursor: var(--cursor-disabled);
}

@media (prefers-reduced-motion: reduce) {
  [data-slot="item"] { transition: none; }
}

/* LIFTED from shadcn/kbd.tsx via scripts/lift.py — the dictionary run in reverse.

   Unmapped words: see kbd.lift-report.json */

[data-slot="kbd"] {

   Unmapped words: see label.lift-report.json */

[data-slot="label"] {

  align-items: center;

  font-size: var(--text-ui);

/* Menubar recipe — contract slots only (contract/authoring.md step 3).
   Structure, states and motion: contract/anatomy/menubar.json.
   A row of dropdown menus sharing one roving tab stop; the panel/item/
   separator/group-label recipes are dropdown-menu's, unchanged.
   No size axis: a menubar is chrome, sized by the app shell. */

/* root — the bar itself */
[data-slot="menubar"] {
  display: flex;
  align-items: center;
  gap: var(--space-inline-sm);
  padding: var(--space-unit);
  background: var(--surface);
  border: var(--border-width) solid var(--border);
  border-radius: var(--radius-control);
  box-shadow: var(--elevation-resting);
}

[data-slot="menubar"] [data-slot="menubar-menu"] {
  position: relative;
}

/* trigger — state:open holds the interaction-selected recipe so the bar
   shows which menu is down */
[data-slot="menubar"] [data-slot="trigger"] {
  display: inline-flex;
  align-items: center;
  height: var(--control-height-sm);
  padding: 0 var(--inset-control-x);
  border: none;
  border-radius: var(--radius-control);
  background: transparent;
  color: var(--on-surface);
  font: var(--type-action);
  text-transform: var(--action-case);
  letter-spacing: var(--action-tracking);
  cursor: var(--cursor-interactive);
  user-select: none;
  outline: none;
  transition:
    background-color var(--duration-fast) var(--easing-standard),
    color var(--duration-fast) var(--easing-standard);
}
[data-slot="menubar"] [data-slot="trigger"]:hover {
  background: var(--interaction-hover);
}
[data-slot="menubar"] [data-slot="trigger"]:active {
  background: var(--interaction-active);
}
[data-slot="menubar"] [data-slot="trigger"][data-state="open"] {
  background: var(--interaction-selected);
  color: var(--on-interaction-selected);
}
[data-slot="menubar"] [data-slot="trigger"]:focus-visible {
  outline: var(--focus-width) solid color-mix(in oklab, var(--focus) 60%, transparent);
  outline-offset: var(--focus-offset);
}
[data-slot="menubar"] [data-slot="trigger"][data-disabled] {
  opacity: 0.5;
  pointer-events: none;
  cursor: var(--cursor-disabled);
}

/* panel */
[data-slot="menubar"] [data-slot="panel"] {
  position: absolute;
  inset-inline-start: 0;
  inset-block-start: calc(100% + var(--space-inline-sm));
  z-index: var(--layer-dropdown);
  min-width: var(--size-overlay-sm);
  padding: var(--space-unit);
  background: var(--surface-overlay);
  color: var(--on-surface-overlay);
  border: var(--border-width) solid var(--border);
  border-radius: var(--radius-overlay);
  box-shadow: var(--elevation-overlay);
  outline: none;
}
[data-slot="menubar"] [data-slot="panel"][data-state="open"] {
  animation: menubar-panel-enter var(--duration-fast) var(--easing-enter);
}
@keyframes menubar-panel-enter {
  from { opacity: 0; transform: translateY(calc(var(--space-unit) * -1)); }
  to { opacity: 1; transform: translateY(0); }
}

/* item */
[data-slot="menubar"] [data-slot="item"] {
  display: flex;
  align-items: center;
  gap: var(--space-inline-md);
  min-height: var(--control-height-sm);
  padding-inline: var(--space-inline-md);
  padding-block: var(--space-inline-sm);
  border-radius: var(--radius-control);
  font: var(--type-label);
  cursor: var(--cursor-interactive);
  user-select: none;
  outline: none;
  transition: background-color var(--duration-fast) var(--easing-standard);
}
[data-slot="menubar"] [data-slot="item"]:hover,
[data-slot="menubar"] [data-slot="item"]:focus {
  background: var(--interaction-hover);
}
[data-slot="menubar"] [data-slot="item"]:active {
  background: var(--interaction-active);
}
[data-slot="menubar"] [data-slot="item"]:focus-visible {
  outline: var(--focus-width) solid color-mix(in oklab, var(--focus) 60%, transparent);
  outline-offset: calc(var(--focus-offset) - var(--border-width));
}
[data-slot="menubar"] [data-slot="item"][data-disabled] {
  opacity: 0.5;
  pointer-events: none;
  cursor: var(--cursor-disabled);
}

/* item-icon */
[data-slot="menubar"] [data-slot="item-icon"] {
  display: inline-flex;
  flex-shrink: 0;
  color: var(--content-secondary);
}
[data-slot="menubar"] [data-slot="item-icon"] svg {
  width: var(--icon-size-inline);
  height: var(--icon-size-inline);
}

/* item-label */
[data-slot="menubar"] [data-slot="item-label"] {
  flex: 1;
  min-width: 0;
  font: var(--type-label);
}

/* item-shortcut */
[data-slot="menubar"] [data-slot="item-shortcut"] {
  flex-shrink: 0;
  margin-inline-start: auto;
  font: var(--type-data);
  color: var(--content-secondary);
}

/* separator */
[data-slot="menubar"] [data-slot="separator"] {
  height: var(--border-width);
  margin-block: var(--space-unit);
  margin-inline: calc(var(--space-unit) * -1);
  background: var(--border-subtle);
}

/* group-label */
[data-slot="menubar"] [data-slot="group-label"] {
  padding-inline: var(--space-inline-md);
  padding-block: var(--space-inline-sm);
  font: var(--type-caption);
  color: var(--content-secondary);
}

@media (prefers-reduced-motion: reduce) {
  [data-slot="menubar"] [data-slot="panel"][data-state="open"] { animation: none; }
  [data-slot="menubar"] [data-slot="trigger"],
  [data-slot="menubar"] [data-slot="item"] { transition: none; }
}

/* Native-select recipe — contract slots only (contract/authoring.md step 3).
   Structure, size axis and states: contract/anatomy/native-select.json.
   The root exists only because the native control cannot paint its own
   chevron; the control recipe matches input's root exactly. */

[data-slot="native-select"] {
  position: relative;
  display: inline-flex;
  align-items: center;
  width: 100%;
  min-width: 0;
  height: var(--control-height-md);
  border-radius: var(--radius-control);
}

/* size axis */
[data-slot="native-select"][data-size="sm"] { height: var(--control-height-sm); }
[data-slot="native-select"][data-size="lg"] { height: var(--control-height-lg); }

[data-slot="native-select"] > [data-slot="control"] {
  appearance: none;
  width: 100%;
  height: 100%;
  min-width: 0;
  padding-inline: var(--inset-control-x)
    calc(var(--inset-control-x) + var(--icon-size-control));
  border: var(--border-width) solid var(--field-border);
  border-radius: var(--radius-control);
  background: var(--field-surface);
  color: var(--on-surface);
  font: var(--type-label);
  box-shadow: var(--elevation-resting);

  transition:
    border-color var(--duration-fast) var(--easing-standard),

}

/* indicator — decorative chevron, pointer-inert; it does NOT rotate on open,

[data-slot="native-select"] > [data-slot="indicator"] {

  inset-inline-end: var(--inset-control-x);
  display: inline-flex;
  align-items: center;

}
[data-slot="native-select"] > [data-slot="indicator"] svg {

  height: var(--icon-size-control);
  stroke-width: var(--icon-stroke);
}

/* option / group-label — the platform paints the popup */
[data-slot="native-select"] [data-slot="option"] {
  font: var(--type-label);
}
[data-slot="native-select"] [data-slot="group-label"] {
  font: var(--type-caption);
  color: var(--content-secondary);
}

/* states (contract/states.md) */
[data-slot="native-select"]:hover > [data-slot="control"] {
  border-color: var(--field-border-hover);
  background: var(--field-surface-hover);
}
[data-slot="native-select"] > [data-slot="control"]:focus-visible {
  border-color: var(--field-border-active);
  outline: var(--focus-width) var(--focus-style)
    color-mix(in oklab, var(--focus) 60%, transparent);
  outline-offset: var(--focus-offset);
}
[data-slot="native-select"][data-state="invalid"] > [data-slot="control"] {
  border-color: var(--status-critical);
}
[data-slot="native-select"][data-state="invalid"] > [data-slot="control"]:focus-visible {
  outline-color: color-mix(in oklab, var(--status-critical) 60%, transparent);
}
[data-slot="native-select"][data-state="readonly"] > [data-slot="control"] {
  background: var(--surface-sunken);
  color: var(--content-secondary);
  cursor: var(--cursor-disabled);
}
[data-slot="native-select"][data-state="readonly"]:hover > [data-slot="control"] {
  border-color: var(--field-border);
  background: var(--surface-sunken);
}
[data-slot="native-select"][data-disabled] {
  opacity: 0.5;
  cursor: var(--cursor-disabled);
}
[data-slot="native-select"][data-disabled] > [data-slot="control"] {
  pointer-events: none;
  cursor: var(--cursor-disabled);
}

@media (prefers-reduced-motion: reduce) {
  [data-slot="native-select"] > [data-slot="control"] { transition: none; }
}

/* Navigation menu recipe — contract slots only (contract/authoring.md step 3).
   Structure, states and motion: contract/anatomy/navigation-menu.json.
   Links stay links; the panel is a free content region, not a menu.

/* root — the nav landmark */
[data-slot="navigation-menu"] {

  flex-direction: column;
  align-items: stretch;
}

/* item */
[data-slot="navigation-menu"] [data-slot="item"] {
  position: relative;
  border-radius: var(--radius-control);
}

/* trigger + link share the top-level chrome */
[data-slot="navigation-menu"] [data-slot="trigger"],

}
[data-slot="navigation-menu"] [data-slot="trigger"]:hover,
[data-slot="navigation-menu"] [data-slot="link"]:hover {
  background: var(--interaction-hover);
  color: var(--on-interaction-selected);
}
[data-slot="navigation-menu"] [data-slot="trigger"]:focus-visible,
[data-slot="navigation-menu"] [data-slot="link"]:focus-visible {
  outline: var(--focus-width) solid color-mix(in oklab, var(--focus) 60%, transparent);
  outline-offset: var(--focus-offset);

[data-slot="navigation-menu"] [data-slot="trigger"][data-disabled],
[data-slot="navigation-menu"] [data-slot="link"][data-disabled] {

[data-slot="navigation-menu"] [data-slot="trigger"][data-state="open"] {
