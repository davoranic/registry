name: Build showroom

on:
  push:
    branches: [main]
    paths:
      - "tokens/**"
      - "themes/**"
      - "contract/**"
      - "registry/**"
      - "scripts/build-showroom.py"
      - "scripts/build-themes.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile themes + generate showroom from repo data
        run: |
          python3 scripts/build-themes.py
          python3 scripts/build-showroom.py
      - name: Commit regenerated dist (triggers Vercel deploy)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dist/
          git diff --staged --quiet || git commit -m "chore: rebuild showroom from repo data [skip ci]"
          git push
