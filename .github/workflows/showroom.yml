name: Build showroom

on:
  push:
    branches: [main]
    paths:
      - "tokens/**"
      - "themes/**"
      - "contract/**"
      - "registry/**"
      - "icons/**"
      - "showroom/**"
      - "scripts/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm ci || npm install
      - name: Compile themes + metadata, bundle live showroom
        run: |
          python3 scripts/build-themes.py
          python3 scripts/gen-showroom-meta.py
          node scripts/bundle-showroom.mjs
      - name: Commit dist (triggers Vercel deploy)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dist/ showroom/*.gen.json
          git diff --staged --quiet || git commit -m "chore: rebuild live showroom [skip ci]"
          git push
