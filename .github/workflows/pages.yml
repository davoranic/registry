# Publish the docs site to registry.davoranic.com
#
# Only the DOCS build runs here — not build.sh. The gates need 3-source/, the
# six design-system clones, which are ~600MB and deliberately not in this repo.
# So CI regenerates the site from committed data only:
#
#   1-intro/content/*.md  +  2-build/{contract,columns}  ->  1-intro/site/index.html
#
# The gate results shown on the "Where we are" page come from
# 2-build/out/gates.json, written by the last local ./build.sh run and
# committed on purpose — CI cannot re-run the gates without the clones, and a
# status page that invented a result would be worse than one that reports the
# last real one.
name: pages

on:
  push:
    branches: [main]
    paths:
      - "1-intro/**"
      - "2-build/contract/**"
      - "2-build/columns/**"
      - "2-build/out/gates.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate the site from markdown
        run: python3 1-intro/build/build-docs.py

      - name: Fail if the build produced nothing
        run: |
          test -s 1-intro/site/index.html
          echo "site: $(wc -c < 1-intro/site/index.html) bytes"

      - name: Custom domain
        run: echo "registry.davoranic.com" > 1-intro/site/CNAME

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: 1-intro/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
