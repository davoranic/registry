name: Contract conformance

on:
  push:
    branches: [main]
  pull_request:

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Adapter conformance (R2 + naming grammar)
        run: python3 scripts/check-conformance.py
      - name: Anatomy conformance (slots, states, axes, icon roles)
        run: python3 scripts/check-anatomy.py
      - name: Theme compile
        run: python3 scripts/build-themes.py
      - name: dist is fresh (no hand edits, no drift)
        run: git diff --exit-code dist/
