name: Dictionary canary

on:
  schedule:
    - cron: "0 6 * * 1"   # weekly, Monday 06:00 UTC
  workflow_dispatch:

jobs:
  canary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: shadcn-ui/ui
          path: ../ui
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Re-lift canary component against live upstream
        run: |
          BEFORE=$(python3 -c "import json; print(len(json.load(open('registry/input/input.lift-report.json'))['unmapped']))")
          python3 scripts/lift.py input
          AFTER=$(python3 -c "import json; print(len(json.load(open('registry/input/input.lift-report.json'))['unmapped']))")
          echo "unmapped before=$BEFORE after=$AFTER"
          test "$AFTER" -le "$BEFORE" || { echo "::error::upstream drift — dictionary has new unknown words"; exit 1; }
